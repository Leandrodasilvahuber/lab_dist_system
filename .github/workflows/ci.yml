# Análise estática e testes unitários. Os testes de integração e e2e
# precisam do LocalStack e continuam locais (README-LOCALSTACK.md).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Parte de lint do `sam validate --lint`, sem SAM CLI nem credenciais AWS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint template.yaml

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O Gitleaks varre o histórico inteiro
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm audit, Semgrep, Gitleaks e Checkov (os três últimos em Docker)
      - run: npm run sast
