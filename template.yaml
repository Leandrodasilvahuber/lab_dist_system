  # Desde out/2025 a Function URL pede as duas permissões para o CloudFront
  HelloFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref HelloFunction
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}'

  HelloFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HelloFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}'

  HelloOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Environment}-ecommerce-hello'
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------- Site do HüberClaude (Lambda própria, em /huberclaude) ----------
  # Mesmo esquema da página inicial: Function URL com AWS_IAM, só o CloudFront chama
  HuberclaudeFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_116:página estática sem evento assíncrono, DLQ não se aplica
    # checkov:skip=CKV_AWS_117:não acessa recursos de VPC
    # checkov:skip=CKV_AWS_173:as variáveis de ambiente vêm do Globals e não são segredos
    # checkov:skip=CKV_AWS_115:contas novas não aceitam reserva de concorrência; reserva só com GatewayConcurrencyLimit
    Properties:
      Handler: index.handler
      MemorySize: 128
      Timeout: 3
      ReservedConcurrentExecutions: !If [LimitGatewayConcurrency, 2, !Ref AWS::NoValue]
      FunctionUrlConfig:
        AuthType: AWS_IAM
      InlineCode: |
        // Site do HüberClaude (CLI de agente de código para Linux, dedicado ao OpenRouter).
        // Mesmo esquema da página inicial: o visual fica em /dashboard/css/huberclaude.css e o
        // idioma em /dashboard/js/huberclaude.js (a CSP só aceita arquivos da mesma origem, nada
        // inline). O HTML vem em português e o JS troca para inglês/espanhol com os atributos data-i18n.
        const GITHUB = 'https://github.com/Leandrodasilvahuber/huberclaude';
        const RELEASES = `${GITHUB}/releases`;
        // Chave PIX para doações (CPF): PIX_KEY é o valor copiado e PIX_LABEL o que aparece na tela.
        // Vazia: a seção mostra "em breve"
        const PIX_KEY = '80799892068';
        const PIX_LABEL = '807.998.920-68';
        const INSTALL = 'git clone https://github.com/Leandrodasilvahuber/huberclaude\ncd huberclaude\nbun install && bun run build\nnpm install -g .';
        // Grupo do WhatsApp para colaborar e discutir o projeto
        const WHATSAPP = 'https://chat.whatsapp.com/BDAAyl2dlm06rhZmn12AVU';

        const mark = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='#15191e'/><g fill='#96af4c'><rect x='6' y='6' width='7' height='3'/><rect x='19' y='6' width='7' height='3'/><rect x='6' y='11' width='7' height='3'/><rect x='19' y='11' width='7' height='3'/><rect x='6' y='15' width='20' height='3'/><rect x='6' y='20' width='7' height='3'/><rect x='19' y='20' width='7' height='3'/><rect x='6' y='25' width='7' height='2'/><rect x='19' y='25' width='7' height='2'/></g></svg>`;
        // Logo do WhatsApp (Simple Icons, CC0) em currentColor, para os botões e o atalho flutuante
        const waIcon = `<svg class="wa-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>`;
