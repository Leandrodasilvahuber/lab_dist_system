          </footer>
          <a class="wa-float" href="${WHATSAPP}" target="_blank" rel="noopener noreferrer" title="Entrar no grupo do WhatsApp" aria-label="Entrar no grupo do WhatsApp" data-i18n-title="community.float" data-i18n-aria-label="community.float">${waIcon}</a>
