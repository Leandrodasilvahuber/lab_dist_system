AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  E-Commerce System com Saga Pattern - API Gateway Centralizado
  - SDKs por serviço com desacoplamento total
  - Saga de compra orquestrada pelo Step Functions (assíncrona, com compensação)
  - EventBridge para eventos de domínio
  - API Gateway centralizada para todos os endpoints

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name

  # O CORS da API já aceita o dashboard no CloudFront (DashboardDistribution) e
  # o local-server (http://localhost:3001, com ?api=). Aqui entra só uma origem
  # a mais, se houver (ex.: https://loja.exemplo.com). Vazio = nenhuma outra
  AllowedOrigin:
    Type: String
    Default: ''
    Description: 'Origem extra permitida pelo CORS (ex.: https://loja.exemplo.com)'

  # Domínio próprio no CloudFront (ex.: www.meulab.com.br). Precisa de uma
  # hosted zone no Route 53 para esse domínio: o stack cria o certificado no
  # ACM (validado por DNS sozinho), o registro A/AAAA apontando para o
  # CloudFront e libera o domínio no CORS. Os dois vazios = só *.cloudfront.net
  DomainName:
    Type: String
    Default: ''
    Description: 'Domínio do site (ex.: www.meulab.com.br). Vazio = só o domínio *.cloudfront.net'
  HostedZoneId:
    Type: String
    Default: ''
    Description: 'ID da hosted zone do Route 53 que contém o DomainName (ex.: Z0123456789ABC)'

  # Bulkhead: teto de execuções simultâneas da GatewayFunction (observabilidade:
  # logs, métricas, DLQ), para que ela não consuma a concorrência das Lambdas da
  # compra. 0 = sem reserva. Contas novas têm limite de concorrência 10 e não
  # aceitam reserva (a AWS exige 100 execuções não reservadas): só ative
  # depois de confirmar o limite da conta (Service Quotas > Lambda).
  GatewayConcurrencyLimit:
    Type: Number
    Default: 0
    MinValue: 0

  # E-mail que recebe os alarmes (tópico AlarmTopic). Vazio = só o tópico, sem
  # assinatura; dá para assinar depois (e-mail, Slack via Chatbot, SMS). A AWS
  # manda um e-mail de confirmação: o aviso só chega depois de confirmar
  AlertEmail:
    Type: String
    Default: ''

  # MemorySize de todas as Lambdas (exceto o authorizer). A aba Recursos usa o
  # mesmo valor como limite no gráfico de memória e na estimativa de custo
  FunctionMemoryMB:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240

  # Compras novas por dia (PurchaseQuota): acima disso POST /saga/execute
  # responde 429 até as 12:00 (Brasília), quando o contador zera. 0 = sem limite
  DailyPurchaseLimit:
    Type: Number
    Default: 150
    MinValue: 0

  # Compras novas por dia de um mesmo IP: sem ele, um script esgotaria o
  # DailyPurchaseLimit de todos. 0 = sem limite por cliente
  DailyPurchaseLimitPerClient:
    Type: Number
    Default: 20
    MinValue: 0

  # Leituras manuais do Cost Explorer por dia (botão Atualizar agora da aba
  # Recursos, US$ 0,02 cada): acima disso POST /metrics/cost/refresh responde
  # 429 até as 12:00 (Brasília). A leitura agendada não conta. 0 = sem limite
  DailyCostRefreshLimit:
    Type: Number
    Default: 5
    MinValue: 0

  # Vezes por dia que a base pode ser zerada (POST /reset, aberto a todos; o
  # dia vira às 12:00 de Brasília). 0 = sem limite
  DailyResetLimit:
    Type: Number
    Default: 10
    MinValue: 0

  # Vezes por dia que o caos pode ser ligado (PUT /chaos, aberto a todos; cada
  # ativação dura no máximo 60 min). Desligar não conta. 0 = sem limite
  DailyChaosLimit:
    Type: Number
    Default: 20
    MinValue: 0

  # Teto mensal (US$) do AWS Budget: avisa no AlarmTopic com 80% gasto e
  # quando a previsão do mês passa de 100%. É o custo da conta inteira
  MonthlyBudgetUSD:
    Type: Number
    Default: 5
    MinValue: 1

  # Requisições à API em 5 min (todas as rotas, inclusive as recusadas com
  # 429) que contam como ataque: duas janelas seguidas acima disso acionam o
  # interruptor de custo (ApiFloodAlarm). 15000 = ~50 req/s sustentados por
  # 10 min, muito acima do dashboard e dos testes de caos. 0 = sem alarme
  FloodRequestsPer5Min:
    Type: Number
    Default: 15000
    MinValue: 0

Conditions:
  # Em prod as tabelas não podem ser apagadas (nem por sam delete); em dev/test
  # a stack continua descartável
  IsProd: !Equals [!Ref Environment, prod]
  LimitGatewayConcurrency: !Not [!Equals [!Ref GatewayConcurrencyLimit, 0]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  # Alarme purchase-limit só com o limite diário de compras ligado
  HasPurchaseLimit: !Not [!Equals [!Ref DailyPurchaseLimit, 0]]
  HasFloodAlarm: !Not [!Equals [!Ref FloodRequestsPer5Min, 0]]
  HasAllowedOrigin: !Not [!Equals [!Ref AllowedOrigin, '']]
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref HostedZoneId, '']]

# Todas as funções são empacotadas com esbuild a partir da raiz do projeto,
# o que inclui automaticamente o código compartilhado de src/common.
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: !Ref FunctionMemoryMB
    Timeout: 15
    # Todas as Lambdas escrevem no mesmo log group (o campo `service` de cada
    # linha diz qual função gerou). As linhas de erro e de ação carregam métricas
    # no Embedded Metric Format (src/common/emf.mjs): o CloudWatch as extrai sozinho
    LoggingConfig:
      LogFormat: Text
      LogGroup: !Ref ServicesLogGroup
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PRODUCTS_TABLE: !Ref ProductsTable
        ORDERS_TABLE: !Ref OrdersTable
        PAYMENTS_TABLE: !Ref PaymentsTable
        STOCK_RESERVATIONS_TABLE: !Ref StockReservationsTable
        INVENTORY_TABLE: !Ref InventoryTable
        SAGAS_TABLE: !Ref SagasTable
        EVENT_BUS_NAME: !Ref EventBus
        FUNCTION_MEMORY_MB: !Ref FunctionMemoryMB
        # Injeção de falhas (src/common/chaos.mjs): config no ChaosConfigParameter,
        # gravada por PUT/DELETE /chaos. Desligada em prod (nem lê o SSM)
        CHAOS_PARAM: !Sub '/${Environment}/ecommerce/chaos'
        CHAOS_ENABLED: !If [IsProd, 'false', 'true']
        # Zerar a base (POST /reset, aberto a todos): desligado em prod
        RESET_ENABLED: !If [IsProd, 'false', 'true']

Resources:
  # API Gateway Centralizado (HttpApi)
  # Rotas específicas vão para cada serviço; o resto cai na GatewayFunction ({proxy+}).
  # Escritas de admin (produto, estoque, ações da DLQ), o custo, as métricas do CloudWatch, os logs e o rastreio usam o authorizer AdminJwt (token do Cognito; mesma lista de src/common/auth.mjs).
  ApiGateway:
    Type: AWS::Serverless::HttpApi
    # checkov:skip=CKV_AWS_95:cada requisição já fica no log estruturado do Gateway (ServicesLogGroup); access log dobraria a ingestão do CloudWatch
    Properties:
      StageName: !Ref Environment
      Description: "API Gateway centralizado para todos os endpoints"
      # O padrão vale para CADA rota sem limite próprio (não é um teto do stage
      # inteiro): com 100 req/s, um script batendo em várias rotas públicas
      # somaria mais de 1000 req/s, todas cobradas (HttpApi, Lambda, log).
      # 10 req/s por rota cabe com folga no uso do dashboard e nos testes de
      # caos (concorrência 4 na AWS). POST /saga/execute fica com o padrão.
      # O limite não é por cliente (o HttpApi não aceita WAF; rate limit por IP
      # exigiria CloudFront + WAF, ~US$ 6/mês): quem segura um script contra
      # todas as rotas é o ApiFloodAlarm, que aciona o interruptor de custo
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 10
      # Bulkhead na entrada: leituras caras (Scan, uma Query por produto,
      # consultas ao CloudWatch) têm limite menor que o padrão, para que um pico
      # nelas não consuma a concorrência das Lambdas que também executam os
      # passos da saga (Stock, Products) nem a capacidade do DynamoDB.
      # Catálogo e estoque: 20-30 req/s; listagens admin: 10; observabilidade: 5;
      # escritas de admin: 2.
      # Burst nunca abaixo da taxa: o balde comporta ao menos 1s de requisições
      RouteSettings:
        # Fallback (rota inexistente): só devolve a lista de endpoints
        'ANY /{proxy+}':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 2
        'GET /health':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        'GET /auth/config':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        'POST /products':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 2
        'DELETE /products/{id}':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 2
        'POST /stock/{productId}/adjust':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 2
        'PUT /chaos':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 2
        'DELETE /chaos':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 2
        'GET /products':
          ThrottlingBurstLimit: 30
          ThrottlingRateLimit: 30
        'GET /orders/{id}':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        # Leitura da config de caos: o dashboard só lê ao abrir a aba
        'GET /chaos':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 2
        'GET /stock':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 20
        'GET /orders':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 10
        'GET /sagas':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 10
        # Polling do dashboard (1 req/s por compra em andamento por aba). Sem
        # limite próprio, abas esquecidas consultando sagas que não existem mais
        # chegaram a 17 req/s; o limite é da rota (todos os clientes somados)
        'GET /saga/{sagaId}':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 20
        # Admin. Cada leitura pode levar segundos de Lambda (até 10 páginas do
        # FilterLogEvents); o LogsClient ainda reaproveita a leitura por 20 s
        'GET /logs':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 2
        # Públicas e com cache de 20 s (AlarmsClient, DlqClient), mas sem
        # limite próprio ficariam com o padrão do stage na GatewayFunction
        'GET /alarms':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        'GET /dlq':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        # Reprocessar/descartar (admin): cada um faz até 5 ReceiveMessage
        'POST /dlq/{messageId}/{action}':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        # Como GET /logs; o id vem do cliente, então o cache ajuda pouco
        'GET /trace/{correlationId}':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 2
        'GET /metrics/sagas':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        'GET /metrics/errors':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        'GET /metrics/slo':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        'GET /metrics/memory':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        'GET /metrics/cost':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 5
        # Cada leitura do Cost Explorer custa US$ 0,02; o CostClient ainda trava
        # em uma a cada 15 min
        'POST /metrics/cost/refresh':
          ThrottlingBurstLimit: 1
          ThrottlingRateLimit: 1
      # Só o dashboard publicado (CloudFront) e o local-server chamam a API pelo
      # navegador. Com CORS aqui, o HttpApi ignora o Access-Control-Allow-Origin
      # que as Lambdas devolvem (src/common/response.mjs)
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${DashboardDistribution.DomainName}'
          - 'http://localhost:3001'
          - !If [HasAllowedOrigin, !Ref AllowedOrigin, !Ref AWS::NoValue]
          - !If [HasCustomDomain, !Sub 'https://${DomainName}', !Ref AWS::NoValue]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization, idempotency-key, x-idempotency-key, x-correlation-id]
        ExposeHeaders: [retry-after]
      Auth:
        Authorizers:
          # Rotas de admin: access token do Cognito (Authorization: Bearer),
          # validado pelo próprio HttpApi (assinatura, emissor, client e
          # expiração), sem Lambda. O dashboard faz o login direto no Cognito
          AdminJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}'
              audience:
                - !Ref AdminUserPoolClient

  # Usuários de admin do dashboard. Sem auto-cadastro: o scripts/deploy.sh cria
  # o usuário (ADMIN_USERNAME/ADMIN_PASSWORD). Plano Lite: grátis até 10 mil
  # usuários ativos por mês
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${Environment}-ecommerce-admins'
      UserPoolTier: LITE
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  # Client público (sem secret: roda no navegador). USER_PASSWORD_AUTH manda a
  # senha só ao Cognito, por TLS; a API só vê o access token, que vale 1 h
  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminUserPool
      ClientName: dashboard
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: hours

  # Gateway Function - health check, alarmes, logs de erro, DLQ e roteamento de fallback
  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: apiRoutes.handler
      ReservedConcurrentExecutions: !If [LimitGatewayConcurrency, !Ref GatewayConcurrencyLimit, !Ref AWS::NoValue]
      Environment:
        Variables:
          ALARM_PREFIX: !Sub '${Environment}-ecommerce-'
          LOG_GROUP_NAME: !Ref ServicesLogGroup
          DLQ_URL: !Ref ProductEventsDlq
          SAGA_STATE_MACHINE_ARN: !Ref SagaStateMachine
          # Aba Recursos: teto do Budget (o id do HttpApi vem no requestContext;
          # !Ref ApiGateway aqui seria dependência circular)
          MONTHLY_BUDGET_USD: !Ref MonthlyBudgetUSD
          # GET /auth/config: o dashboard descobre onde fazer o login de admin
          ADMIN_AUTH_REGION: !Ref AWS::Region
          ADMIN_AUTH_CLIENT_ID: !Ref AdminUserPoolClient
          # Última leitura do Cost Explorer (CostClient.refreshActual)
          COST_SNAPSHOTS_TABLE: !Ref CostSnapshotsTable
          COST_REFRESH_DAILY_LIMIT: !Ref DailyCostRefreshLimit
          RESET_DAILY_LIMIT: !Ref DailyResetLimit
          CHAOS_DAILY_LIMIT: !Ref DailyChaosLimit
      Policies:
        - Statement:
            # GetMetricData/ListMetrics: aba Métricas (namespace Ecommerce/<env>, gravado via EMF)
            - Effect: Allow
              Action:
                - cloudwatch:DescribeAlarms
                - cloudwatch:GetMetricData
                - cloudwatch:ListMetrics
              Resource: '*'
            # Aba Recursos: custo real e previsão do mês (cada chamada custa
            # US$ 0,01). Só a regra RefreshCost (a cada 6 h) e o POST
            # /metrics/cost/refresh de admin chamam; o GET lê a CostSnapshotsTable
            - Effect: Allow
              Action:
                - ce:GetCostAndUsage
                - ce:GetCostForecast
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt CostSnapshotsTable.Arn
            # Aba Desempenho: lê o histórico das últimas execuções da saga
            - Effect: Allow
              Action: states:ListExecutions
              Resource: !Ref SagaStateMachine
            - Effect: Allow
              Action: states:GetExecutionHistory
              Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${SagaStateMachine.Name}:*'
            - Effect: Allow
              Action: logs:FilterLogEvents
              Resource: !GetAtt ServicesLogGroup.Arn
            # Aba DLQ: listar, reprocessar (republica no EventBus) e descartar
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:ChangeMessageVisibility
                - sqs:GetQueueAttributes
              Resource: !GetAtt ProductEventsDlq.Arn
            # Aba Caos: lê e grava a config de injeção de falhas
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/ecommerce/chaos'
        # Aba SLOs: desfecho e duração das compras (Scan na tabela de sagas).
        # POST /reset (ResetClient): apaga tudo, grava os produtos do seed e
        # conta os resets do dia na tabela de sagas. Desligado em prod, e lá a
        # Gateway nem recebe a escrita: só a leitura das sagas
        - !If
          - IsProd
          - DynamoDBReadPolicy:
              TableName: !Ref SagasTable
          - DynamoDBCrudPolicy:
              TableName: !Ref SagasTable
        - !If
          - IsProd
          - !Ref AWS::NoValue
          - DynamoDBCrudPolicy:
              TableName: !Ref ProductsTable
        - !If
          - IsProd
          - !Ref AWS::NoValue
          - DynamoDBCrudPolicy:
              TableName: !Ref OrdersTable
        - !If
          - IsProd
          - !Ref AWS::NoValue
          - DynamoDBCrudPolicy:
              TableName: !Ref PaymentsTable
        - !If
          - IsProd
          - !Ref AWS::NoValue
          - DynamoDBCrudPolicy:
              TableName: !Ref StockReservationsTable
        - !If
          - IsProd
          - !Ref AWS::NoValue
          - DynamoDBCrudPolicy:
              TableName: !Ref InventoryTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /health
            Method: GET
        AuthConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /auth/config
            Method: GET
        Alarms:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /alarms
            Method: GET
        Logs:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /logs
            Method: GET
            Auth:
              Authorizer: AdminJwt
        SagaMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /metrics/sagas
            Method: GET
        # GetMetricData é cobrado por métrica: só admin (src/common/auth.mjs)
        ErrorMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /metrics/errors
            Method: GET
            Auth:
              Authorizer: AdminJwt
        SloMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /metrics/slo
            Method: GET
        # GetMetricData é cobrado por métrica: só admin (src/common/auth.mjs)
        MemoryMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /metrics/memory
            Method: GET
            Auth:
              Authorizer: AdminJwt
        # Gasto da conta inteira (Cost Explorer): só admin (src/common/auth.mjs)
        CostMetrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /metrics/cost
            Method: GET
            Auth:
              Authorizer: AdminJwt
        # Lê o Cost Explorer agora (no máximo uma vez a cada 15 min): só admin
        RefreshCostNow:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /metrics/cost/refresh
            Method: POST
            Auth:
              Authorizer: AdminJwt
        # Lê o Cost Explorer e grava na CostSnapshotsTable: o custo fica fixo
        # (~4 leituras por dia), qualquer que seja o tráfego da aba Recursos
        RefreshCost:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Input: '{"action":"refreshCost"}'
        Trace:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /trace/{correlationId}
            Method: GET
            Auth:
              Authorizer: AdminJwt
        ListDlq:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /dlq
            Method: GET
        # Reprocessar/descartar: só admin (src/common/auth.mjs); a lista é aberta
        DlqAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /dlq/{messageId}/{action}
            Method: POST
            Auth:
              Authorizer: AdminJwt
        GetChaos:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /chaos
            Method: GET
        # Ligar e desligar a injeção de falhas: aberto a todos, até DailyChaosLimit ativações por dia (desligado em prod)
        PutChaos:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /chaos
            Method: PUT
        DeleteChaos:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /chaos
            Method: DELETE
        # Zerar a base: aberto a todos, até DailyResetLimit vezes por dia (desligado em prod)
        GetReset:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /reset
            Method: GET
        PostReset:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /reset
            Method: POST
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/layers/api-gateway-layer/src/routes/apiRoutes.js]
        External: ['@aws-sdk/*']

  # Product Service
  ProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          SERVICE_TYPE: product
      Events:
        ListProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /products
            Method: GET
        GetProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /products/{id}
            Method: GET
        CreateProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /products
            Method: POST
            Auth:
              Authorizer: AdminJwt
        DeleteProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /products/{id}
            Method: DELETE
            Auth:
              Authorizer: AdminJwt
      Policies:
        # Config de caos (src/common/chaos.mjs)
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${Environment}/ecommerce/chaos'
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/products/index.mjs]
        External: ['@aws-sdk/*']

  # Order Service
  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          SERVICE_TYPE: order
      Events:
        GetOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /orders
            Method: GET
        GetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /orders/{id}
            Method: GET
      Policies:
        # Config de caos (src/common/chaos.mjs)
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${Environment}/ecommerce/chaos'
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/orders/index.mjs]
        External: ['@aws-sdk/*']

  # Payment Service
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          SERVICE_TYPE: payment
          PAYMENT_MAX_AMOUNT: '10000'
      # Sem rotas HTTP: só executa as ações da saga (processPayment, refundPayment)
      Policies:
        # Config de caos (src/common/chaos.mjs)
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${Environment}/ecommerce/chaos'
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/payments/index.mjs]
        External: ['@aws-sdk/*']

  # Stock Service
  StockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          SERVICE_TYPE: stock
          # O ajuste que cria o inventário confere se o produto existe
          PRODUCT_FUNCTION_NAME: !Ref ProductFunction
      # O EventBridge invoca esta função de forma assíncrona: erro da função não
      # volta para a regra (o RetryPolicy/DeadLetterConfig dela só cobrem falhas
      # de entrega). Quem repete é a Lambda; esgotadas as tentativas, o evento
      # vai para a mesma DLQ. Só vale para invocações assíncronas: Step Functions
      # e HttpApi chamam de forma síncrona e recebem o erro.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt ProductEventsDlq.Arn
      Events:
        GetStock:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /stock
            Method: GET
        GetStockItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /stock/{productId}
            Method: GET
        AdjustStock:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /stock/{productId}/adjust
            Method: POST
            Auth:
              Authorizer: AdminJwt
      Policies:
        # Config de caos (src/common/chaos.mjs)
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${Environment}/ecommerce/chaos'
        - DynamoDBCrudPolicy:
            TableName: !Ref StockReservationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProductEventsDlq.QueueName
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        - LambdaInvokePolicy:
            FunctionName: !Ref ProductFunction
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/stock/index.mjs]
        External: ['@aws-sdk/*']

  # Saga Orchestrator
  SagaOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      # Pior caso do POST /saga/execute com uma tentativa por chamada do SDK
      # (SDK_MAX_ATTEMPTS: 1; cada chamada tem até 1s de conexão + 3s de
      # resposta, ver src/common/aws-client.mjs): getItem 4s + Products 6s
      # (+ até 4,6s de espera se a Lambda de produtos recusar por throttling,
      # THROTTLE_DELAYS_MS em product-client.mjs) + gravação da saga 4s (uma
      # transação só com os contadores do limite diário, PurchaseQuota) + StartExecution
      # 4s + gravação do resultado 4s = 26,6s. O
      # reinício de uma saga que falhou ao iniciar é o caminho mais longo:
      # getItem 4s + updateItem 4s + StartExecution 4s + novo executionName 4s
      # + StartExecution 4s + gravação do resultado 4s = 24s. Com 28s a Lambda
      # responde (503 com Retry-After) antes de estourar e abaixo do teto de
      # 30s do HttpApi. O caso comum (Products fora do ar) falha em
      # ~6s, ou na hora com o circuito aberto. Sem o retry do SDK, throttling e
      # timeout do DynamoDB (inclusive em GET /sagas) respondem 503 com
      # Retry-After (isTransientAwsError), e quem repete é o cliente.
      Timeout: 28
      Environment:
        Variables:
          SERVICE_TYPE: saga-orchestrator
          SDK_MAX_ATTEMPTS: '1'
          SAGA_STATE_MACHINE_ARN: !Ref SagaStateMachine
          PRODUCT_FUNCTION_NAME: !Ref ProductFunction
          DAILY_PURCHASE_LIMIT: !Ref DailyPurchaseLimit
          DAILY_PURCHASE_LIMIT_PER_CLIENT: !Ref DailyPurchaseLimitPerClient
      Events:
        ExecuteSaga:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /saga/execute
            Method: POST
        GetSaga:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /saga/{sagaId}
            Method: GET
        ListSagas:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /sagas
            Method: GET
        # Corrige o status de saga parada em andamento: execução que terminou
        # sem conseguir gravar o status final ou que estourou o teto da execução
        # (SagaService.reconcileStuckSagas)
        ReconcileSagas:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"action":"reconcileStuckSagas","input":{}}'
      Policies:
        # Config de caos (src/common/chaos.mjs)
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${Environment}/ecommerce/chaos'
        - DynamoDBCrudPolicy:
            TableName: !Ref SagasTable
        # Como a execução terminou (reconciliação). O nome vem do padrão da
        # SagaStateMachine, sem !Ref (que criaria dependência circular)
        - Statement:
            - Effect: Allow
              Action: states:DescribeExecution
              Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${Environment}-purchase-saga:*'
        # Dados do produto vêm do serviço de Products, não da tabela dele
        - LambdaInvokePolicy:
            FunctionName: !Ref ProductFunction
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt SagaStateMachine.Name
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/saga-orchestrator/index.mjs]
        External: ['@aws-sdk/*']

  # Saga de compra orquestrada pelo Step Functions
  # Definição gerada por scripts/generate-saga-workflow.py
  SagaStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${Environment}-purchase-saga'
      Type: STANDARD
      DefinitionUri: src/ecommerce/saga-orchestrator/workflow/saga-workflow.asl.json
      # Erros de cada execução no CloudWatch e trace no X-Ray (investigar COMPENSATION_FAILED)
      Logging:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt SagaStateMachineLogGroup.Arn
      Tracing:
        Enabled: true
      DefinitionSubstitutions:
        OrderFunctionArn: !GetAtt OrderFunction.Arn
        PaymentFunctionArn: !GetAtt PaymentFunction.Arn
        StockFunctionArn: !GetAtt StockFunction.Arn
        SagasTableName: !Ref SagasTable
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref OrderFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PaymentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref StockFunction
        - DynamoDBCrudPolicy:
            TableName: !Ref SagasTable
        # Entrega de logs do Step Functions (exige Resource "*") e X-Ray
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: '*'

  SagaStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/${Environment}-purchase-saga'
      RetentionInDays: 14

  # EventBridge - eventos de domínio (OrderCreated, PaymentRefunded...) para quem quiser ouvir
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${Environment}-ecommerce-events'

  # Auditoria e replay dos eventos de pedidos. Não é fila de erro: erro vai
  # para o log, e só falha transitória de entrega vai para DLQ.
  OrderEventsArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub '${Environment}-order-events'
      Description: 'Eventos de pedidos (source: orders) para auditoria e replay'
      SourceArn: !GetAtt EventBus.Arn
      EventPattern:
        source: ['orders']
      RetentionDays: 10

  # Produto criado/excluído -> serviço de Stock cria/remove o inventário.
  # Só falhas transitórias chegam à DLQ (reprocessamento manual): erro de negócio
  # é registrado no log e o evento é confirmado (runEventHandler em src/common/actions.mjs).
  # Duas entradas na DLQ: o DeadLetterConfig abaixo (falha de entrega à Lambda)
  # e o OnFailure do EventInvokeConfig da StockFunction (a função falhou).
  ProductEventsToStockRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: ['products']
        detail-type: ['ProductCreated', 'ProductDeleted']
      State: ENABLED
      Targets:
        - Arn: !GetAtt StockFunction.Arn
          Id: StockFunctionTarget
          RetryPolicy:
            MaximumRetryAttempts: 20
            MaximumEventAgeInSeconds: 86400
          DeadLetterConfig:
            Arn: !GetAtt ProductEventsDlq.Arn

  ProductEventsToStockPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StockFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProductEventsToStockRule.Arn

  ProductEventsDlq:
    Type: AWS::SQS::Queue
    # checkov:skip=CKV_AWS_27:criptografada com SSE-SQS (SqsManagedSseEnabled), que o check não reconhece; só aceita KMS
    Properties:
      QueueName: !Sub '${Environment}-ProductEventsDlq'
      MessageRetentionPeriod: 1209600
      # SSE-SQS: criptografia em repouso sem custo de KMS (aceita pelo EventBridge como DLQ)
      SqsManagedSseEnabled: true

  ProductEventsDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProductEventsDlq
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: "sqs:SendMessage"
            Resource: !GetAtt ProductEventsDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ProductEventsToStockRule.Arn

  # ---------- Logs e alarmes ----------
  # Config da injeção de falhas (src/common/chaos.mjs). Começa sem falhas; a
  # aba Caos e npm run chaos gravam por PUT /chaos (sempre com expiresAt).
  # Atualizar a stack volta o valor para o inicial (desliga o caos)
  ChaosConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${Environment}/ecommerce/chaos'
      Type: String
      Value: '{"faults":[]}'
      Description: Injeção de falhas do laboratório (engenharia de caos)

  ServicesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Environment}-ecommerce'
      RetentionInDays: 14

  # Os alarmes começam com ${Environment}-ecommerce- (ALARM_PREFIX do GET /alarms)
  UnhandledErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-unhandled-errors'
      AlarmDescription: 'Erros não tratados nos logs das Lambdas'
      Namespace: !Sub 'Ecommerce/${Environment}'
      MetricName: UnhandledErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Erros de negócio (recusa de pagamento, falta de estoque, validação...) são
  # esperados; o alarme só pega um volume fora do normal. Métrica via EMF.
  BusinessErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-business-errors'
      AlarmDescription: 'Volume alto de erros de negócio (ver aba Métricas, por ErrorType)'
      Namespace: !Sub 'Ecommerce/${Environment}'
      MetricName: BusinessErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProductEventsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-product-events-dlq'
      AlarmDescription: 'Eventos de produto na DLQ: inventário não criado/removido, reprocessar'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProductEventsDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # Limite diário de compras atingido (DailyPurchaseLimit, PurchaseQuota): as
  # vendas param até as 12:00 (Brasília). Métrica via EMF a cada compra recusada
  # (PurchaseLimitHit, dimensão Scope). Período de 1 h: com o limite esgotado,
  # no máximo um aviso por hora, não um por tentativa. Sem OKActions: voltar ao
  # normal (nenhuma tentativa na hora) não é notícia
  PurchaseLimitAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasPurchaseLimit
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-purchase-limit'
      AlarmDescription: !Sub 'Limite diário de ${DailyPurchaseLimit} compras atingido: POST /saga/execute responde 429 até as 12:00 (Brasília). Suba DailyPurchaseLimit se for demanda real'
      Namespace: !Sub 'Ecommerce/${Environment}'
      MetricName: PurchaseLimitHit
      Dimensions:
        - Name: Scope
          Value: total
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Circuit breaker aberto (src/common/circuit-breaker.mjs): a saga parou de
  # chamar o serviço de Products e as compras recebem 503 com Retry-After.
  # Métrica gravada via EMF na abertura (CircuitOpened, dimensão Circuit).
  # Os 503 também entram no 5xx nativo do API Gateway (alarme api-5xx): os dois
  # disparam juntos; este aponta a causa
  CircuitBreakerOpenAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-circuit-open'
      AlarmDescription: 'Circuit breaker products aberto: compras recusadas com 503 (ver CIRCUIT_STATE_CHANGED nos logs e a saúde da ProductFunction)'
      Namespace: !Sub 'Ecommerce/${Environment}'
      MetricName: CircuitOpened
      Dimensions:
        - Name: Circuit
          Value: products
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # A saga compensada termina no estado Fail "SagaCompensated", então
  # AWS/States ExecutionsFailed mistura compensação (esperada: cartão recusado,
  # falta de estoque) com saga que nem a compensação fechou. Os filtros abaixo
  # separam as duas pelo erro final da execução no log da state machine.
  SagaCompensationsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SagaStateMachineLogGroup
      FilterPattern: '{ $.type = "ExecutionFailed" && $.details.error = "SagaCompensated" }'
      MetricTransformations:
        - MetricNamespace: !Sub 'Ecommerce/${Environment}'
          MetricName: SagaCompensations
          MetricValue: '1'
          Unit: Count

  SagaUnrecoveredMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SagaStateMachineLogGroup
      FilterPattern: '{ $.type = "ExecutionFailed" && $.details.error != "SagaCompensated" }'
      MetricTransformations:
        - MetricNamespace: !Sub 'Ecommerce/${Environment}'
          MetricName: SagaUnrecovered
          MetricValue: '1'
          Unit: Count

  # Só saga não recuperada: CompensationFailed, SagaFailed, timeout ou abortada
  SagaExecutionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-saga-failed'
      AlarmDescription: 'Saga que nem a compensação conseguiu fechar: CompensationFailed/SagaFailed/timeout (ver SagaStateMachineLogGroup)'
      Metrics:
        - Id: failed
          Label: SagaUnrecovered + ExecutionsTimedOut + ExecutionsAborted
          Expression: FILL(unrecovered, 0) + FILL(timedOut, 0) + FILL(aborted, 0)
          ReturnData: true
        - Id: unrecovered
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Sub 'Ecommerce/${Environment}'
              MetricName: SagaUnrecovered
            Period: 300
            Stat: Sum
        - Id: timedOut
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsTimedOut
              Dimensions:
                - Name: StateMachineArn
                  Value: !Ref SagaStateMachine
            Period: 300
            Stat: Sum
        - Id: aborted
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsAborted
              Dimensions:
                - Name: StateMachineArn
                  Value: !Ref SagaStateMachine
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # Algumas compensações são esperadas; o alarme pega a taxa fora do patamar.
  # Com menos de 20 execuções em 5 min a taxa não é avaliada (1 recusa em 2
  # compras já daria 50%).
  SagaCompensationRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-saga-compensation-rate'
      AlarmDescription: 'Mais de 5% das sagas compensadas (cartão recusado, falta de estoque...): fora do patamar normal'
      Metrics:
        - Id: rate
          Label: '% de sagas compensadas'
          Expression: IF(FILL(started, 0) >= 20, 100 * FILL(compensated, 0) / started, 0)
          ReturnData: true
        - Id: started
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/States
              MetricName: ExecutionsStarted
              Dimensions:
                - Name: StateMachineArn
                  Value: !Ref SagaStateMachine
            Period: 300
            Stat: Sum
        - Id: compensated
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: !Sub 'Ecommerce/${Environment}'
              MetricName: SagaCompensations
            Period: 300
            Stat: Sum
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # SLOs nativos (CloudWatch Application Signals → Service Level Objectives):
  # histórico, error budget e burn rate só na AWS. As metas são as mesmas da
  # aba SLOs do dashboard (SLO_TARGETS em SloClient.js), que calcula os valores
  # direto da tabela de sagas e da DLQ e é a única visão no LocalStack.

  # Compensação é desfecho aceito (cartão recusado, falta de estoque); falha é
  # a saga que nem a compensação fechou, timeout ou execução abortada
  SloSagaOutcome:
    Type: AWS::ApplicationSignals::ServiceLevelObjective
    Properties:
      Name: !Sub '${Environment}-ecommerce-slo-saga-outcome'
      Description: '>= 99,5% das sagas terminam em Completed ou Compensated'
      RequestBasedSli:
        RequestBasedSliMetric:
          TotalRequestCountMetric:
            - Id: total
              ReturnData: true
              Expression: FILL(succeeded, 0) + FILL(compensated, 0) + FILL(unrecovered, 0) + FILL(timedOut, 0) + FILL(aborted, 0)
            - Id: succeeded
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: AWS/States
                  MetricName: ExecutionsSucceeded
                  Dimensions:
                    - Name: StateMachineArn
                      Value: !Ref SagaStateMachine
                Period: 60
                Stat: Sum
            - Id: compensated
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: !Sub 'Ecommerce/${Environment}'
                  MetricName: SagaCompensations
                Period: 60
                Stat: Sum
            - Id: unrecovered
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: !Sub 'Ecommerce/${Environment}'
                  MetricName: SagaUnrecovered
                Period: 60
                Stat: Sum
            - Id: timedOut
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: AWS/States
                  MetricName: ExecutionsTimedOut
                  Dimensions:
                    - Name: StateMachineArn
                      Value: !Ref SagaStateMachine
                Period: 60
                Stat: Sum
            - Id: aborted
              ReturnData: false
              MetricStat:
                Metric:
                  Namespace: AWS/States
                  MetricName: ExecutionsAborted
                  Dimensions:
                    - Name: StateMachineArn
                      Value: !Ref SagaStateMachine
                Period: 60
                Stat: Sum
          MonitoredRequestCountMetric:
            GoodCountMetric:
              - Id: good
                ReturnData: true
                Expression: FILL(goodSucceeded, 0) + FILL(goodCompensated, 0)
              - Id: goodSucceeded
                ReturnData: false
                MetricStat:
                  Metric:
                    Namespace: AWS/States
                    MetricName: ExecutionsSucceeded
                    Dimensions:
                      - Name: StateMachineArn
                        Value: !Ref SagaStateMachine
                  Period: 60
                  Stat: Sum
              - Id: goodCompensated
                ReturnData: false
                MetricStat:
                  Metric:
                    Namespace: !Sub 'Ecommerce/${Environment}'
                    MetricName: SagaCompensations
                  Period: 60
                  Stat: Sum
      Goal:
        Interval:
          RollingInterval:
            DurationUnit: DAY
            Duration: 1
        AttainmentGoal: 99.5
      BurnRateConfigurations:
        - LookBackWindowMinutes: 60

  # ExecutionTime inclui as sagas compensadas (o Step Functions não separa);
  # a aba do dashboard mede só as COMPLETED. Meta: 99% das janelas de 5 min
  # com p95 abaixo de 2 s
  SloPurchaseLatency:
    Type: AWS::ApplicationSignals::ServiceLevelObjective
    Properties:
      Name: !Sub '${Environment}-ecommerce-slo-purchase-latency'
      Description: 'p95 da duração da saga de compra < 2 s'
      Sli:
        SliMetric:
          MetricDataQueries:
            - Id: p95
              ReturnData: true
              MetricStat:
                Metric:
                  Namespace: AWS/States
                  MetricName: ExecutionTime
                  Dimensions:
                    - Name: StateMachineArn
                      Value: !Ref SagaStateMachine
                Period: 300
                Stat: p95
                Unit: Milliseconds
        MetricThreshold: 2000
        ComparisonOperator: LessThan
      Goal:
        Interval:
          RollingInterval:
            DurationUnit: DAY
            Duration: 1
        AttainmentGoal: 99
      BurnRateConfigurations:
        - LookBackWindowMinutes: 60

  # Mensagem tratada (reprocessada ou descartada) sai da fila: idade da mais
  # antiga acima de 24 h = evento esquecido. Meta 99,9% ~ nenhuma janela violada
  SloDlqAge:
    Type: AWS::ApplicationSignals::ServiceLevelObjective
    Properties:
      Name: !Sub '${Environment}-ecommerce-slo-dlq-age'
      Description: 'Nenhuma mensagem na DLQ sem tratamento há mais de 24 h'
      Sli:
        SliMetric:
          MetricDataQueries:
            - Id: oldest
              ReturnData: true
              MetricStat:
                Metric:
                  Namespace: AWS/SQS
                  MetricName: ApproximateAgeOfOldestMessage
                  Dimensions:
                    - Name: QueueName
                      Value: !GetAtt ProductEventsDlq.QueueName
                Period: 300
                Stat: Maximum
        MetricThreshold: 86400
        ComparisonOperator: LessThan
      Goal:
        Interval:
          RollingInterval:
            DurationUnit: DAY
            Duration: 1
        AttainmentGoal: 99.9
      BurnRateConfigurations:
        - LookBackWindowMinutes: 60

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-api-5xx'
      AlarmDescription: 'Respostas 5xx da API'
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ApiGateway
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ---------- Notificação dos alarmes ----------
  # Sem AlarmActions, um alarme só muda de cor no console: ninguém fica sabendo.
  # Todos os alarmes publicam aqui ao entrar em ALARM e ao voltar a OK
  AlarmTopic:
    Type: AWS::SNS::Topic
    # checkov:skip=CKV_AWS_26:o CloudWatch e o Budgets não publicam em tópico com a chave gerenciada aws/sns, e uma CMK custa US$ 1/mês; o tópico só leva avisos de alarme
    Properties:
      TopicName: !Sub '${Environment}-ecommerce-alarms'
      DisplayName: !Sub 'E-commerce ${Environment}: alarmes'

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # O AWS Budgets publica no mesmo tópico dos alarmes; o SNS só aceita com
  # permissão explícita para o serviço. Uma TopicPolicy SUBSTITUI a política
  # padrão do tópico: sem as duas primeiras regras, os alarmes do CloudWatch
  # (e o dono da conta) deixariam de publicar e o e-mail pararia de chegar
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountOwner
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sns:Publish
              - sns:Subscribe
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:ListSubscriptionsByTopic
            Resource: !Ref AlarmTopic
          - Sid: AllowCloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # Custo mensal da conta (o Budgets não filtra por stack sem tags de alocação
  # de custo ativadas). Avisa uma vez ao passar de 80% do gasto real e quando a
  # previsão do mês passa do teto
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    DependsOn: AlarmTopicPolicy
    Properties:
      Budget:
        BudgetName: !Sub '${Environment}-ecommerce-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlarmTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlarmTopic

  # Gasto real passou do teto: bloqueia a API (CostKillSwitchFunction). Budget
  # próprio, e não mais uma notificação no MonthlyBudget: no CloudFormation,
  # mudar as notificações de um Budget exige substituí-lo, e com BudgetName fixo
  # a substituição falha (nome já existe). O Budgets aceita um só tópico SNS por
  # notificação; o e-mail vem da assinatura do próprio CostKillSwitchTopic
  CostKillSwitchBudget:
    Type: AWS::Budgets::Budget
    DependsOn: CostKillSwitchTopicPolicy
    Properties:
      Budget:
        BudgetName: !Sub '${Environment}-ecommerce-kill-switch'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostKillSwitchTopic

  # Interruptor de custo: o MonthlyBudget só avisa, e um script contra as rotas
  # públicas continuaria gerando cobrança depois do aviso. Quando o gasto real
  # passa de MonthlyBudgetUSD (CostKillSwitchBudget), a função zera o
  # throttling do stage (toda requisição recebe 429 do API Gateway, sem chegar
  # às Lambdas). O Budget é atualizado algumas vezes por dia, então o bloqueio
  # por ele chega com horas de atraso; o ApiFloodAlarm pega o volume anormal
  # em ~10 min e aciona o mesmo tópico. Religar: ver
  # src/layers/api-gateway-layer/src/ops/costKillSwitch.js
  CostKillSwitchTopic:
    Type: AWS::SNS::Topic
    # checkov:skip=CKV_AWS_26:mesmo caso do AlarmTopic (publicado por alarme do CloudWatch, só leva avisos)
    Properties:
      TopicName: !Sub '${Environment}-ecommerce-cost-kill-switch'
      DisplayName: !Sub 'E-commerce ${Environment}: API bloqueada por custo'

  CostKillSwitchEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref CostKillSwitchTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Mesma ideia da AlarmTopicPolicy (substitui a política padrão do tópico)
  CostKillSwitchTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref CostKillSwitchTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountOwner
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sns:Publish
              - sns:Subscribe
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:ListSubscriptionsByTopic
            Resource: !Ref CostKillSwitchTopic
          - Sid: AllowCloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CostKillSwitchTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CostKillSwitchTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  CostKillSwitchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: costKillSwitch.handler
      MemorySize: 128
      Timeout: 30
      Environment:
        Variables:
          API_ID: !Ref ApiGateway
          STAGE_NAME: !Ref Environment
          THROTTLE_BACKUP_PARAM: !Sub '/${Environment}/ecommerce/throttle-backup'
          # Nome fixo, sem !Ref ApiFloodAlarm: o alarme depende do tópico, e o
          # tópico (evento SNS) desta função; vazio sem o alarme
          FLOOD_ALARM_NAME: !If [HasFloodAlarm, !Sub '${Environment}-ecommerce-api-flood', '']
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - apigateway:GET
                - apigateway:PATCH
              Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${ApiGateway}/stages/${Environment}'
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/ecommerce/throttle-backup'
            # Restore: devolve o ApiFloodAlarm para OK (ver costKillSwitch.js)
            - Effect: Allow
              Action: cloudwatch:SetAlarmState
              Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Environment}-ecommerce-api-flood'
      Events:
        BudgetExceeded:
          Type: SNS
          Properties:
            Topic: !Ref CostKillSwitchTopic
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/layers/api-gateway-layer/src/ops/costKillSwitch.js]
        External: ['@aws-sdk/*']

  # Volume de ataque (script contra as rotas públicas): o Budget só vê o gasto
  # horas depois, e até lá os limites por rota (somados, ~150 req/s) já teriam
  # consumido o free tier. Duas janelas de 5 min acima de FloodRequestsPer5Min
  # publicam no CostKillSwitchTopic e a API é bloqueada (religar: restore do
  # CostKillSwitchFunction). Count inclui as recusadas com 429: depois do
  # bloqueio o alarme continua em ALARM enquanto o script insistir, e o restore
  # o devolve para OK, para que um ataque ainda ativo bloqueie a API de novo
  ApiFloodAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasFloodAlarm
    Properties:
      AlarmActions: [!Ref CostKillSwitchTopic, !Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-api-flood'
      AlarmDescription: !Sub 'Mais de ${FloodRequestsPer5Min} requisições em 5 min por 10 min: API bloqueada pelo interruptor de custo (religar com {"action":"restore"} no CostKillSwitchFunction)'
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions:
        - Name: ApiId
          Value: !Ref ApiGateway
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref FloodRequestsPer5Min
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Cliente consultando em loop o que não existe (ex.: aba esquecida acompanhando
  # sagas apagadas): leituras com 404 (ClientErrors, http-handler.mjs), que ficam
  # fora do business-errors. 300 em 5 min = ~1 req/s sustentado
  ClientErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-client-errors'
      AlarmDescription: 'Leituras com 404 em volume (cliente em loop consultando o que não existe; ver aba Métricas, cartão 404)'
      Namespace: !Sub 'Ecommerce/${Environment}'
      MetricName: ClientErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Saga em andamento que a reconciliação não conseguiu fechar (Step Functions
  # sem resposta, falha ao corrigir). A varredura (a cada 5 min)
  # publica SagasStuck mesmo com 0; duas rodadas seguidas = parada há >10 min
  SagasStuckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-sagas-stuck'
      AlarmDescription: 'Saga em andamento há mais de 5 min que a reconciliação não fechou (ver log SAGAS_STUCK_CHECKED e aba SLOs, Travadas)'
      Namespace: !Sub 'Ecommerce/${Environment}'
      MetricName: SagasStuck
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Sem dado (deploy novo, antes da 1ª varredura; ou a varredura parou) o
      # alarme fica em "Sem dados", visível no painel, sem e-mail. Com
      # breaching, cada deploy mandava um ALARM falso até a varredura rodar
      TreatMissingData: missing

  # Throttling nas Lambdas da compra e do gateway: a concorrência acabou (pico,
  # cliente em loop) e invocações estão sendo recusadas
  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]
      AlarmName: !Sub '${Environment}-ecommerce-lambda-throttles'
      AlarmDescription: 'Invocações recusadas por falta de concorrência (Throttles) nas Lambdas do e-commerce'
      Metrics:
        - Id: total
          Label: Throttles (todas as funções)
          Expression: FILL(t1, 0) + FILL(t2, 0) + FILL(t3, 0) + FILL(t4, 0) + FILL(t5, 0) + FILL(t6, 0)
          ReturnData: true
        - Id: t1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ProductFunction
            Period: 300
            Stat: Sum
        - Id: t2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref OrderFunction
            Period: 300
            Stat: Sum
        - Id: t3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref PaymentFunction
            Period: 300
            Stat: Sum
        - Id: t4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref StockFunction
            Period: 300
            Stat: Sum
        - Id: t5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref SagaOrchestratorFunction
            Period: 300
            Stat: Sum
        - Id: t6
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GatewayFunction
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ---------- Dashboard publicado (S3 + CloudFront) ----------
  # Os arquivos de dashboard/ vão para um bucket privado (scripts/deploy.sh faz
  # o upload depois do sam deploy) e só o CloudFront lê, via Origin Access
  # Control. O dashboard chama a API direto no execute-api (CORS acima): passar
  # a API pelo CloudFront trocaria o IP do cliente pelo do CloudFront e
  # quebraria o limite diário de compras por IP (DailyPurchaseLimitPerClient).
  # Custo: dentro do free tier do CloudFront (1 TB e 10 mi de requisições/mês)
  # e centavos de S3. Para apagar o stack, esvazie o bucket antes
  DashboardBucket:
    Type: AWS::S3::Bucket
    # checkov:skip=CKV_AWS_18:só arquivos estáticos públicos via CloudFront; access log do S3 seria outro bucket só para isso
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Versões antigas (cada deploy sobrescreve os arquivos) somem em 7 dias
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${DashboardBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DashboardBucket.Arn
              - !Sub '${DashboardBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  DashboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Environment}-ecommerce-dashboard'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Os mesmos headers de segurança do local-server.mjs. connect-src: a API
  # (execute-api da região) e o Cognito do login de admin. Sem <script> inline
  # no index.html (o do tema é js/theme-init.js), script-src fica só 'self'
  DashboardSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${Environment}-ecommerce-dashboard'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://cognito-idp.${AWS::Region}.amazonaws.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()'
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            - Header: Cross-Origin-Resource-Policy
              Value: same-origin
              Override: true

  # ---------- Página inicial (Lambda hello world) ----------
  # A raiz do site (/) é esta Lambda; o dashboard fica em /laboratory (e os
  # assets em /dashboard/*), servido do S3. A Function URL exige assinatura
  # (AWS_IAM): só o CloudFront, via Origin Access Control, consegue chamar
  HelloFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_116:página estática sem evento assíncrono, DLQ não se aplica
    # checkov:skip=CKV_AWS_117:não acessa recursos de VPC
    # checkov:skip=CKV_AWS_173:as variáveis de ambiente vêm do Globals e não são segredos
    # checkov:skip=CKV_AWS_115:contas novas não aceitam reserva de concorrência; reserva só com GatewayConcurrencyLimit
    Properties:
      Handler: index.handler
      MemorySize: 128
      Timeout: 3
      # Teto de execuções: a página é pública e não pode tirar concorrência da compra
      ReservedConcurrentExecutions: !If [LimitGatewayConcurrency, 2, !Ref AWS::NoValue]
      FunctionUrlConfig:
        AuthType: AWS_IAM
      InlineCode: |
        // Página inicial: hello world com link para o dashboard (/laboratory).
        // Sem <style>/<script> inline: a CSP do CloudFront só permite style="..."
        const html = `<!doctype html>
        <html lang="pt-BR">
        <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hello World</title></head>
        <body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#0f1115;color:#e6e6e6">
          <main style="text-align:center;padding:24px">
            <h1 style="font-size:2.5rem;margin:0 0 12px">Hello World 👋</h1>
            <p style="margin:0 0 24px;color:#9aa0a6">Página servida por uma AWS Lambda.</p>
            <a href="/laboratory" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#4ade80;color:#0f1115;font-weight:600;text-decoration:none">Abrir o laboratório (dashboard)</a>
          </main>
        </body>
        </html>`;
        // InlineCode vira index.js (CommonJS): exports, não export
        exports.handler = async () => ({
          statusCode: 200,
          headers: { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-cache' },
          body: html
        });

  # Desde out/2025 a Function URL pede as duas permissões para o CloudFront
  HelloFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref HelloFunction
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}'

  HelloFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HelloFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}'

  HelloOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Environment}-ecommerce-hello'
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # /laboratory e /laboratory/... devolvem o index.html do dashboard (o
  # roteamento do dashboard fica no hash, #/slo, então o caminho não importa)
  LaboratoryRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${Environment}-ecommerce-laboratory-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: /laboratory -> /index.html do dashboard
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = '/index.html';
          return request;
        }

  # Certificado do domínio próprio. O CloudFront só aceita certificado de
  # us-east-1 (a região deste stack); a validação por DNS na hosted zone é
  # automática e o deploy espera ela terminar (alguns minutos)
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # Z2FDTNDATAQYW2: hosted zone fixa de todo alias para o CloudFront
  SiteDnsRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt DashboardDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  SiteDnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt DashboardDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    # checkov:skip=CKV_AWS_68:WAF custa ~US$ 6/mês; o dashboard é estático e a API tem throttling e limites diários próprios
    # checkov:skip=CKV_AWS_86:access log do CloudFront exigiria outro bucket; o tráfego da API já fica no ServicesLogGroup
    # checkov:skip=CKV_AWS_174:o domínio padrão *.cloudfront.net não aceita escolher a versão mínima do TLS (com domínio próprio fica TLSv1.2_2021)
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Site e dashboard do ${Environment}-ecommerce'
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        HttpVersion: http2and3
        IPV6Enabled: true
        # Só América do Norte e Europa (mais barato); o Brasil é servido de lá
        PriceClass: PriceClass_100
        Origins:
          - Id: dashboard-s3
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DashboardOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: hello-lambda
            # https://<id>.lambda-url.<região>.on.aws/ -> <id>.lambda-url.<região>.on.aws
            DomainName: !Select [2, !Split ['/', !GetAtt HelloFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt HelloOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        # Raiz e qualquer outro caminho: a Lambda hello world (sem cache)
        DefaultCacheBehavior:
          TargetOriginId: hello-lambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingDisabled e Managed-AllViewerExceptHostHeader (a
          # Function URL precisa receber o próprio Host, não o do site)
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: !Ref DashboardSecurityHeaders
        CacheBehaviors:
          # Página do dashboard
          - PathPattern: /laboratory*
            TargetOriginId: dashboard-s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref DashboardSecurityHeaders
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt LaboratoryRewriteFunction.FunctionMetadata.FunctionARN
          # Assets do dashboard (js, css)
          - PathPattern: /dashboard/*
            TargetOriginId: dashboard-s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed-CachingOptimized. Os arquivos sobem com Cache-Control: no-cache
            # (scripts/deploy.sh), então um deploy novo aparece sem invalidação
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref DashboardSecurityHeaders
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref SiteCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  # ---------- Dashboard e Logs Insights ----------
  # Visão de saúde agregada (testes de carga e chaos). A latência por etapa usa
  # SEARCH na métrica EMF ActionDuration, então ação nova entra sozinha.
  # O zoom num caso específico é a consulta salva TraceByCorrelationIdQuery.
  HealthDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${Environment}-ecommerce'
      # Lista de variáveis: o alarme purchase-limit só existe com HasPurchaseLimit
      DashboardBody: !Sub
      - |
        {
          "start": "-PT3H",
          "periodOverride": "inherit",
          "widgets": [
            { "type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {
              "markdown": "## Saúde da saga de compra (${Environment})\nPara investigar uma compra: Logs Insights → Consultas salvas → **ecommerce/${Environment}/Rastreio por correlationId** (troque COLE_O_CORRELATION_ID pelo id)."
            } },
            { "type": "metric", "x": 0, "y": 2, "width": 12, "height": 6, "properties": {
              "title": "Sagas por minuto", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
              "metrics": [
                [ "AWS/States", "ExecutionsStarted", "StateMachineArn", "${SagaStateMachine}", { "label": "iniciadas" } ],
                [ ".", "ExecutionsSucceeded", ".", ".", { "label": "concluídas" } ],
                [ "Ecommerce/${Environment}", "SagaCompensations", { "label": "compensadas" } ],
                [ ".", "SagaUnrecovered", { "label": "não recuperadas" } ],
                [ "AWS/States", "ExecutionsTimedOut", "StateMachineArn", "${SagaStateMachine}", { "label": "timeout" } ],
                [ ".", "ExecutionsAborted", ".", ".", { "label": "abortadas" } ]
              ]
            } },
            { "type": "metric", "x": 12, "y": 2, "width": 12, "height": 6, "properties": {
              "title": "Taxa de sucesso e de compensação (%)", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
              "yAxis": { "left": { "min": 0, "max": 100 } },
              "metrics": [
                [ { "expression": "IF(started > 0, 100 * FILL(succeeded, 0) / started)", "label": "sucesso", "id": "success" } ],
                [ { "expression": "IF(started > 0, 100 * FILL(compensated, 0) / started)", "label": "compensação", "id": "compensation" } ],
                [ "AWS/States", "ExecutionsStarted", "StateMachineArn", "${SagaStateMachine}", { "id": "started", "stat": "Sum", "visible": false } ],
                [ ".", "ExecutionsSucceeded", ".", ".", { "id": "succeeded", "stat": "Sum", "visible": false } ],
                [ "Ecommerce/${Environment}", "SagaCompensations", { "id": "compensated", "stat": "Sum", "visible": false } ]
              ]
            } },
            { "type": "metric", "x": 0, "y": 8, "width": 8, "height": 6, "properties": {
              "title": "Latência p50 por etapa (ms)", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
              "metrics": [ [ { "expression": "SEARCH('{Ecommerce/${Environment},Action,Outcome} MetricName=\"ActionDuration\" Outcome=\"ok\"', 'p50', 60)", "id": "p50" } ] ]
            } },
            { "type": "metric", "x": 8, "y": 8, "width": 8, "height": 6, "properties": {
              "title": "Latência p95 por etapa (ms)", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
              "metrics": [ [ { "expression": "SEARCH('{Ecommerce/${Environment},Action,Outcome} MetricName=\"ActionDuration\" Outcome=\"ok\"', 'p95', 60)", "id": "p95" } ] ]
            } },
            { "type": "metric", "x": 16, "y": 8, "width": 8, "height": 6, "properties": {
              "title": "Latência p99 por etapa (ms)", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
              "metrics": [ [ { "expression": "SEARCH('{Ecommerce/${Environment},Action,Outcome} MetricName=\"ActionDuration\" Outcome=\"ok\"', 'p99', 60)", "id": "p99" } ] ]
            } },
            { "type": "metric", "x": 0, "y": 14, "width": 12, "height": 6, "properties": {
              "title": "Erros", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
              "metrics": [
                [ "Ecommerce/${Environment}", "UnhandledErrors", { "label": "não tratados (error)" } ],
                [ ".", "BusinessErrors", { "label": "de negócio (warn)" } ],
                [ "AWS/ApiGateway", "5xx", "ApiId", "${ApiGateway}", "Stage", "${Environment}", { "label": "API 5xx" } ],
                [ { "expression": "SEARCH('{Ecommerce/${Environment},Action,Outcome} MetricName=\"ActionCount\" Outcome=\"failed\"', 'Sum', 60)", "id": "failedSteps", "label": "etapa falhou" } ]
              ]
            } },
            { "type": "metric", "x": 12, "y": 14, "width": 12, "height": 6, "properties": {
              "title": "Erros por Lambda", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
              "metrics": [
                [ "AWS/Lambda", "Errors", "FunctionName", "${GatewayFunction}", { "label": "gateway" } ],
                [ "...", "${ProductFunction}", { "label": "product" } ],
                [ "...", "${OrderFunction}", { "label": "order" } ],
                [ "...", "${PaymentFunction}", { "label": "payment" } ],
                [ "...", "${StockFunction}", { "label": "stock" } ],
                [ "...", "${SagaOrchestratorFunction}", { "label": "saga-orchestrator" } ]
              ]
            } },
            { "type": "metric", "x": 0, "y": 20, "width": 12, "height": 6, "properties": {
              "title": "Throttles", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
              "metrics": [
                [ "AWS/Lambda", "Throttles", "FunctionName", "${GatewayFunction}", { "label": "gateway" } ],
                [ "...", "${ProductFunction}", { "label": "product" } ],
                [ "...", "${OrderFunction}", { "label": "order" } ],
                [ "...", "${PaymentFunction}", { "label": "payment" } ],
                [ "...", "${StockFunction}", { "label": "stock" } ],
                [ "...", "${SagaOrchestratorFunction}", { "label": "saga-orchestrator" } ],
                [ "AWS/States", "ExecutionThrottled", "StateMachineArn", "${SagaStateMachine}", { "label": "saga (Step Functions)" } ],
                [ "AWS/ApiGateway", "4xx", "ApiId", "${ApiGateway}", "Stage", "${Environment}", { "label": "API 4xx (inclui 429)" } ]
              ]
            } },
            { "type": "metric", "x": 12, "y": 20, "width": 12, "height": 6, "properties": {
              "title": "Throttles do DynamoDB", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
              "metrics": [ [ { "expression": "SEARCH('{AWS/DynamoDB,TableName} (MetricName=\"ReadThrottleEvents\" OR MetricName=\"WriteThrottleEvents\") (TableName=\"${ProductsTable}\" OR TableName=\"${OrdersTable}\" OR TableName=\"${PaymentsTable}\" OR TableName=\"${StockReservationsTable}\" OR TableName=\"${InventoryTable}\" OR TableName=\"${SagasTable}\")', 'Sum', 60)", "id": "ddb" } ] ]
            } },
            { "type": "metric", "x": 0, "y": 26, "width": 12, "height": 6, "properties": {
              "title": "DLQ de eventos de produto", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
              "metrics": [
                [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ProductEventsDlq.QueueName}", { "label": "mensagens" } ],
                [ ".", "ApproximateAgeOfOldestMessage", ".", ".", { "label": "idade da mais antiga (s)", "yAxis": "right" } ]
              ]
            } },
            { "type": "alarm", "x": 12, "y": 26, "width": 12, "height": 6, "properties": {
              "title": "Alarmes",
              "alarms": [
                "${UnhandledErrorsAlarm.Arn}",
                "${BusinessErrorsAlarm.Arn}",
                "${SagaExecutionsFailedAlarm.Arn}",
                "${SagaCompensationRateAlarm.Arn}",
                "${ApiServerErrorsAlarm.Arn}",
                "${ProductEventsDlqAlarm.Arn}",
                "${CircuitBreakerOpenAlarm.Arn}",
                "${ClientErrorsAlarm.Arn}",
                "${SagasStuckAlarm.Arn}",
                "${LambdaThrottlesAlarm.Arn}"${PurchaseLimitAlarmEntry}${FloodAlarmEntry}
              ]
            } },
            { "type": "metric", "x": 0, "y": 32, "width": 24, "height": 6, "properties": {
              "title": "Memória usada por Lambda (MB, RSS ao fim da invocação)", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
              "yAxis": { "left": { "min": 0 } },
              "annotations": { "horizontal": [ { "label": "MemorySize", "value": ${FunctionMemoryMB} } ] },
              "metrics": [ [ { "expression": "SEARCH('{Ecommerce/${Environment},FunctionName} MetricName=\"MemoryUsedMB\"', 'Maximum', 60)", "id": "memory" } ] ]
            } },
            { "type": "log", "x": 0, "y": 38, "width": 24, "height": 6, "properties": {
              "title": "Últimos erros (error e warn)", "region": "${AWS::Region}", "view": "table",
              "query": "SOURCE '${ServicesLogGroup}' | fields @timestamp, status, event, correlationId, message | filter status = 'error' or status = 'warn' | sort @timestamp desc | limit 50"
            } }
          ]
        }
      - PurchaseLimitAlarmEntry: !If [HasPurchaseLimit, !Sub ',"${PurchaseLimitAlarm.Arn}"', '']
        FloodAlarmEntry: !If [HasFloodAlarm, !Sub ',"${ApiFloodAlarm.Arn}"', '']

  # Consultas salvas (Logs Insights → Consultas salvas → ecommerce/<env>/...)
  # O like casa o id em qualquer lugar da linha: nas Lambdas ele está no campo
  # correlationId; no log da state machine, dentro do input/output da execução.
  TraceByCorrelationIdQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub 'ecommerce/${Environment}/Rastreio por correlationId'
      LogGroupNames:
        - !Ref ServicesLogGroup
        - !Ref SagaStateMachineLogGroup
      QueryString: |
        fields @timestamp, @log, service, event, status, type, message, error
        | filter @message like "COLE_O_CORRELATION_ID"
        | sort @timestamp asc
        | limit 1000

  ErrorsByEventQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub 'ecommerce/${Environment}/Erros por evento'
      LogGroupNames:
        - !Ref ServicesLogGroup
      QueryString: |
        filter status = "error" or status = "warn"
        | stats count(*) as total by status, event, errorType
        | sort total desc

  SlowestStepsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub 'ecommerce/${Environment}/Etapas mais lentas'
      LogGroupNames:
        - !Ref ServicesLogGroup
      QueryString: |
        filter event = "ACTION_COMPLETED"
        | stats count(*) as calls, pct(data.durationMs, 50) as p50, pct(data.durationMs, 95) as p95, pct(data.durationMs, 99) as p99, max(data.durationMs) as maxMs by message
        | sort p95 desc

  # DynamoDB Tables
  # Todas com backup contínuo (PITR: restauração em qualquer ponto dos últimos
  # 35 dias) e, em prod, proteção contra exclusão (condição IsProd).
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Products'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Orders'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Payments'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ActiveReservationsIndex: índice esparso das reservas ativas (compras em
  # andamento) por produto. activeProductId só existe enquanto a reserva está
  # ativa, então o índice fica pequeno e não concentra escritas numa partição.
  StockReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-StockReservations'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: activeProductId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ActiveReservationsIndex
          KeySchema:
            - AttributeName: activeProductId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Quantidade disponível por produto (dono: serviço de Stock, chave id = productId)
  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Inventory'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # Saga Orchestrator Table - Stores saga state and execution tracking
  # SagasByDayIndex: sagas por dia de criação para a aba SLOs (Query na janela
  # em vez de Scan na tabela). dayShard = "YYYY-MM-DD#k", com k de 0 a 9: o
  # shard espalha as escritas do dia (ver src/common/saga-day-index.mjs).
  # Projeta só o que o SLO lê. Sagas antigas: npm run backfill:sagas
  SagasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Sagas'
      BillingMode: PAY_PER_REQUEST
      # Só os contadores do limite diário (PurchaseQuota) gravam expiresAt
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: dayShard
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SagasByDayIndex
          KeySchema:
            - AttributeName: dayShard
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [status, updatedAt]

  # Última leitura do Cost Explorer: um item só (id 'actual'), regravado a
  # cada leitura. Sem PITR: é cache, a próxima leitura recria
  CostSnapshotsTable:
    Type: AWS::DynamoDB::Table
    # checkov:skip=CKV_AWS_28:cache da última leitura do Cost Explorer; se perder, a próxima leitura recria
    Properties:
      TableName: !Sub '${Environment}-CostSnapshots'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  AlarmTopicArn:
    Description: "Tópico SNS dos alarmes (assine e-mail, Slack via Chatbot ou SMS)"
    Value: !Ref AlarmTopic

  ApiGatewayUrl:
    Description: "API Gateway URL (público)"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  ApiGatewayId:
    Description: "API Gateway ID"
    Value: !Ref ApiGateway

  AdminUserPoolId:
    Description: "User pool do Cognito com os admins do dashboard (scripts/deploy.sh cria o usuário)"
    Value: !Ref AdminUserPool

  AdminUserPoolClientId:
    Description: "Client do dashboard no Cognito (login de admin)"
    Value: !Ref AdminUserPoolClient

  EventBusName:
    Description: "EventBridge bus name"
    Value: !Ref EventBus

  OrderEventsArchive:
    Description: "Archive dos eventos de pedidos (auditoria e replay)"
    Value: !Ref OrderEventsArchive

  ServicesLogGroup:
    Description: "Logs das Lambdas (erros não tratados com status error)"
    Value: !Ref ServicesLogGroup

  SagaStateMachineLogGroup:
    Description: "Logs de erro das execuções da saga"
    Value: !Ref SagaStateMachineLogGroup

  ProductEventsDlqUrl:
    Description: "DLQ dos eventos de produto não entregues ao Stock"
    Value: !Ref ProductEventsDlq

  ProductsTable:
    Description: "Products DynamoDB Table Name"
    Value: !Ref ProductsTable

  OrdersTable:
    Description: "Orders DynamoDB Table Name"
    Value: !Ref OrdersTable

  PaymentsTable:
    Description: "Payments DynamoDB Table Name"
    Value: !Ref PaymentsTable

  StockReservationsTable:
    Description: "Stock Reservations DynamoDB Table Name"
    Value: !Ref StockReservationsTable

  InventoryTable:
    Description: "Inventory DynamoDB Table Name"
    Value: !Ref InventoryTable

  SagasTable:
    Description: "Sagas DynamoDB Table Name"
    Value: !Ref SagasTable

  SagaOrchestratorFunction:
    Description: "Saga Orchestrator Lambda Function"
    Value: !Ref SagaOrchestratorFunction

  SagaStateMachineArn:
    Description: "Saga State Machine ARN"
    Value: !Ref SagaStateMachine

  SiteUrl:
    Description: "Página inicial (Lambda hello world), com link para o dashboard"
    Value: !If [HasCustomDomain, !Sub 'https://${DomainName}', !Sub 'https://${DashboardDistribution.DomainName}']

  DashboardUrl:
    Description: "Dashboard (front) publicado no CloudFront"
    Value: !If [HasCustomDomain, !Sub 'https://${DomainName}/laboratory', !Sub 'https://${DashboardDistribution.DomainName}/laboratory']

  DashboardBucketName:
    Description: "Bucket com os arquivos do dashboard (scripts/deploy.sh faz o upload)"
    Value: !Ref DashboardBucket

  DashboardDistributionId:
    Description: "Distribuição do CloudFront do dashboard"
    Value: !Ref DashboardDistribution

  HealthDashboardUrl:
    Description: "Dashboard de saúde da saga (CloudWatch)"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${HealthDashboard}"
