AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  E-Commerce System com Saga Pattern - API Gateway Centralizado
  - SDKs por serviço com desacoplamento total
  - Saga de compra orquestrada pelo Step Functions (assíncrona, com compensação)
  - EventBridge para eventos de domínio
  - API Gateway centralizada para todos os endpoints

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name

  AllowedOrigin:
    Type: String
    Default: '*'
    Description: 'Origem permitida pelo CORS (ex.: https://loja.exemplo.com)'

# Todas as funções são empacotadas com esbuild a partir da raiz do projeto,
# o que inclui automaticamente o código compartilhado de src/common.
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
    # Todas as Lambdas escrevem no mesmo log group (o campo `service` de cada
    # linha diz qual função gerou), onde o metric filter conta os erros não tratados
    LoggingConfig:
      LogFormat: Text
      LogGroup: !Ref ServicesLogGroup
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PRODUCTS_TABLE: !Ref ProductsTable
        ORDERS_TABLE: !Ref OrdersTable
        PAYMENTS_TABLE: !Ref PaymentsTable
        STOCK_RESERVATIONS_TABLE: !Ref StockReservationsTable
        INVENTORY_TABLE: !Ref InventoryTable
        SAGAS_TABLE: !Ref SagasTable
        EVENT_BUS_NAME: !Ref EventBus

Resources:
  # API Gateway Centralizado (HttpApi)
  # Rotas específicas vão para cada serviço; o resto cai na GatewayFunction ({proxy+}).
  # Rotas administrativas usam o authorizer AdminApiKey (mesma lista de src/common/auth.mjs).
  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: "API Gateway centralizado para todos os endpoints"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 100
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, x-api-key, idempotency-key, x-idempotency-key, x-correlation-id]
      Auth:
        Authorizers:
          AdminApiKey:
            FunctionArn: !GetAtt AdminAuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            Identity:
              Headers: [x-api-key]
              ReauthorizeEvery: 300

  # Authorizer das rotas administrativas: compara X-Api-Key com a chave guardada
  # no SSM Parameter Store (SecureString, criado por scripts/deploy.sh). A chave
  # não fica no template nem em variável de ambiente.
  AdminAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: adminAuthorizer.handler
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          ADMIN_API_KEY_PARAM: !Sub '/${Environment}/ecommerce/admin-api-key'
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${Environment}/ecommerce/admin-api-key'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/layers/api-gateway-layer/src/auth/adminAuthorizer.js]
        External: ['@aws-sdk/*']

  # Gateway Function - health check, alarmes, logs de erro, DLQ e roteamento de fallback
  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: apiRoutes.handler
      Environment:
        Variables:
          ALARM_PREFIX: !Sub '${Environment}-ecommerce-'
          LOG_GROUP_NAME: !Ref ServicesLogGroup
          DLQ_URL: !Ref ProductEventsDlq
      Policies:
        - Statement:
            - Effect: Allow
              Action: cloudwatch:DescribeAlarms
              Resource: '*'
            - Effect: Allow
              Action: logs:FilterLogEvents
              Resource: !GetAtt ServicesLogGroup.Arn
            # Aba DLQ: listar, reprocessar (republica no EventBus) e descartar
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:ChangeMessageVisibility
                - sqs:GetQueueAttributes
              Resource: !GetAtt ProductEventsDlq.Arn
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /health
            Method: GET
        Alarms:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /alarms
            Method: GET
        Logs:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /logs
            Method: GET
            Auth:
              Authorizer: AdminApiKey
        ListDlq:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /dlq
            Method: GET
            Auth:
              Authorizer: AdminApiKey
        DlqAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /dlq/{messageId}/{action}
            Method: POST
            Auth:
              Authorizer: AdminApiKey
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/layers/api-gateway-layer/src/routes/apiRoutes.js]
        External: ['@aws-sdk/*']

  # Product Service
  ProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          SERVICE_TYPE: product
      Events:
        ListProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /products
            Method: GET
        GetProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /products/{id}
            Method: GET
        CreateProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /products
            Method: POST
            Auth:
              Authorizer: AdminApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/products/index.mjs]
        External: ['@aws-sdk/*']

  # Order Service
  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          SERVICE_TYPE: order
      Events:
        GetOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /orders
            Method: GET
        GetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /orders/{id}
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/orders/index.mjs]
        External: ['@aws-sdk/*']

  # Payment Service
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          SERVICE_TYPE: payment
          PAYMENT_MAX_AMOUNT: '10000'
      # Sem rotas HTTP: só executa as ações da saga (processPayment, refundPayment)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/payments/index.mjs]
        External: ['@aws-sdk/*']

  # Stock Service
  StockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Environment:
        Variables:
          SERVICE_TYPE: stock
      Events:
        GetStock:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /stock
            Method: GET
        GetStockItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /stock/{productId}
            Method: GET
        AdjustStock:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /stock/{productId}/adjust
            Method: POST
            Auth:
              Authorizer: AdminApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StockReservationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/stock/index.mjs]
        External: ['@aws-sdk/*']

  # Saga Orchestrator
  SagaOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Timeout: 30
      Environment:
        Variables:
          SERVICE_TYPE: saga-orchestrator
          SAGA_STATE_MACHINE_ARN: !Ref SagaStateMachine
          PRODUCT_FUNCTION_NAME: !Ref ProductFunction
      Events:
        ExecuteSaga:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /saga/execute
            Method: POST
        GetSaga:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /saga/{sagaId}
            Method: GET
        ListSagas:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /sagas
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SagasTable
        # Dados do produto vêm do serviço de Products, não da tabela dele
        - LambdaInvokePolicy:
            FunctionName: !Ref ProductFunction
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt SagaStateMachine.Name
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        EntryPoints: [src/ecommerce/saga-orchestrator/index.mjs]
        External: ['@aws-sdk/*']

  # Saga de compra orquestrada pelo Step Functions
  # Definição gerada por scripts/generate-saga-workflow.py
  SagaStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${Environment}-purchase-saga'
      Type: STANDARD
      DefinitionUri: src/ecommerce/saga-orchestrator/workflow/saga-workflow.asl.json
      # Erros de cada execução no CloudWatch e trace no X-Ray (investigar COMPENSATION_FAILED)
      Logging:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt SagaStateMachineLogGroup.Arn
      Tracing:
        Enabled: true
      DefinitionSubstitutions:
        OrderFunctionArn: !GetAtt OrderFunction.Arn
        PaymentFunctionArn: !GetAtt PaymentFunction.Arn
        StockFunctionArn: !GetAtt StockFunction.Arn
        SagasTableName: !Ref SagasTable
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref OrderFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PaymentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref StockFunction
        - DynamoDBCrudPolicy:
            TableName: !Ref SagasTable
        # Entrega de logs do Step Functions (exige Resource "*") e X-Ray
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: '*'

  SagaStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/${Environment}-purchase-saga'
      RetentionInDays: 14

  # EventBridge - eventos de domínio (OrderCreated, PaymentRefunded...) para quem quiser ouvir
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${Environment}-ecommerce-events'

  # Auditoria e replay dos eventos de pedidos. Não é fila de erro: erro vai
  # para o log, e só falha transitória de entrega vai para DLQ.
  OrderEventsArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub '${Environment}-order-events'
      Description: 'Eventos de pedidos (source: orders) para auditoria e replay'
      SourceArn: !GetAtt EventBus.Arn
      EventPattern:
        source: ['orders']
      RetentionDays: 10

  # Produto criado/excluído -> serviço de Stock cria/remove o inventário.
  # Só falhas transitórias chegam à DLQ (reprocessamento manual): erro de negócio
  # é registrado no log e o evento é confirmado (runEventHandler em src/common/actions.mjs).
  ProductEventsToStockRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: ['products']
        detail-type: ['ProductCreated', 'ProductDeleted']
      State: ENABLED
      Targets:
        - Arn: !GetAtt StockFunction.Arn
          Id: StockFunctionTarget
          RetryPolicy:
            MaximumRetryAttempts: 20
            MaximumEventAgeInSeconds: 86400
          DeadLetterConfig:
            Arn: !GetAtt ProductEventsDlq.Arn

  ProductEventsToStockPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StockFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProductEventsToStockRule.Arn

  ProductEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Environment}-ProductEventsDlq'
      MessageRetentionPeriod: 1209600

  ProductEventsDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProductEventsDlq
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: "sqs:SendMessage"
            Resource: !GetAtt ProductEventsDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ProductEventsToStockRule.Arn

  # ---------- Logs e alarmes ----------
  ServicesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Environment}-ecommerce'
      RetentionInDays: 14

  # Linhas com status "error" (src/common/logger.mjs) = erros não tratados.
  # Erros de negócio saem com status "warn" e não contam.
  UnhandledErrorsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ServicesLogGroup
      FilterPattern: '{ $.status = "error" }'
      MetricTransformations:
        - MetricNamespace: !Sub 'Ecommerce/${Environment}'
          MetricName: UnhandledErrors
          MetricValue: '1'
          DefaultValue: 0

  # Os alarmes começam com ${Environment}-ecommerce- (ALARM_PREFIX do GET /alarms)
  UnhandledErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-ecommerce-unhandled-errors'
      AlarmDescription: 'Erros não tratados nos logs das Lambdas'
      Namespace: !Sub 'Ecommerce/${Environment}'
      MetricName: UnhandledErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ProductEventsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-ecommerce-product-events-dlq'
      AlarmDescription: 'Eventos de produto na DLQ: inventário não criado/removido, reprocessar'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProductEventsDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SagaExecutionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-ecommerce-saga-failed'
      AlarmDescription: 'Execuções da saga de compra que falharam (ver SagaStateMachineLogGroup)'
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref SagaStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-ecommerce-api-5xx'
      AlarmDescription: 'Respostas 5xx da API'
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ApiGateway
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # DynamoDB Tables
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Products'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Payments'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # StatusIndex: reservas ativas (compras em andamento) por produto, sem scan
  StockReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-StockReservations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: productId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Quantidade disponível por produto (dono: serviço de Stock, chave id = productId)
  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Inventory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # Saga Orchestrator Table - Stores saga state and execution tracking
  SagasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Sagas'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  ApiGatewayUrl:
    Description: "API Gateway URL (público)"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  ApiGatewayId:
    Description: "API Gateway ID"
    Value: !Ref ApiGateway

  EventBusName:
    Description: "EventBridge bus name"
    Value: !Ref EventBus

  OrderEventsArchive:
    Description: "Archive dos eventos de pedidos (auditoria e replay)"
    Value: !Ref OrderEventsArchive

  ServicesLogGroup:
    Description: "Logs das Lambdas (erros não tratados com status error)"
    Value: !Ref ServicesLogGroup

  SagaStateMachineLogGroup:
    Description: "Logs de erro das execuções da saga"
    Value: !Ref SagaStateMachineLogGroup

  ProductEventsDlqUrl:
    Description: "DLQ dos eventos de produto não entregues ao Stock"
    Value: !Ref ProductEventsDlq

  ProductsTable:
    Description: "Products DynamoDB Table Name"
    Value: !Ref ProductsTable

  OrdersTable:
    Description: "Orders DynamoDB Table Name"
    Value: !Ref OrdersTable

  PaymentsTable:
    Description: "Payments DynamoDB Table Name"
    Value: !Ref PaymentsTable

  StockReservationsTable:
    Description: "Stock Reservations DynamoDB Table Name"
    Value: !Ref StockReservationsTable

  InventoryTable:
    Description: "Inventory DynamoDB Table Name"
    Value: !Ref InventoryTable

  SagasTable:
    Description: "Sagas DynamoDB Table Name"
    Value: !Ref SagasTable

  SagaOrchestratorFunction:
    Description: "Saga Orchestrator Lambda Function"
    Value: !Ref SagaOrchestratorFunction

  SagaStateMachineArn:
    Description: "Saga State Machine ARN"
    Value: !Ref SagaStateMachine
