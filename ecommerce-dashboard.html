<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .product-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .product-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .product-item h3 {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .product-item p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .order-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .order-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .order-item h3 {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .order-item p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-processing {
            background: #fff3cd;
            color: #856404;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .stock-list {
            list-style: none;
        }

        .stock-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stock-info h3 {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .stock-info p {
            color: #666;
            font-size: 0.9em;
        }

        .stock-quantity {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .toast-error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .toast-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .health-indicator {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .health-status {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
        }

        .health-status.healthy {
            color: #38ef7d;
        }

        .health-status.unhealthy {
            color: #f45c43;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .connection-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }

        .connection-dot.connected {
            background: #38ef7d;
            box-shadow: 0 0 10px #38ef7d;
        }

        .connection-dot.disconnected {
            background: #f45c43;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 E-commerce Dashboard</h1>

        <div class="card health-indicator">
            <h2>🏥 Status do Sistema</h2>
            <div class="connection-status">
                <div class="connection-dot" id="connectionDot"></div>
                <span id="connectionStatus">Conectando...</span>
            </div>
            <div class="health-status" id="healthStatus">Verificando...</div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2>📦 Adicionar Produto</h2>
                <form id="productForm">
                    <div class="form-group">
                        <label for="productName">Nome do Produto</label>
                        <input type="text" id="productName" required placeholder="Ex: Smartphone XYZ">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Preço (R$)</label>
                        <input type="number" id="productPrice" required step="0.01" min="0" placeholder="Ex: 999.90">
                    </div>
                    <div class="form-group">
                        <label for="productStock">Estoque Inicial</label>
                        <input type="number" id="productStock" required min="0" placeholder="Ex: 50">
                    </div>
                    <button type="submit" class="btn-primary">Adicionar Produto</button>
                </form>
            </div>

            <div class="card">
                <h2>📋 Lista de Produtos</h2>
                <ul id="productList" class="product-list">
                    <li style="text-align: center; color: #999; padding: 20px;">Carregando produtos...</li>
                </ul>
            </div>
        </div>

        <div class="dashboard">
            <div class="card">
                <h2>📦 Estoque Atual</h2>
                <ul id="stockList" class="stock-list">
                    <li style="text-align: center; color: #999; padding: 20px;">Carregando estoque...</li>
                </ul>
            </div>

            <div class="card">
                <h2>🛒 Novo Pedido</h2>
                <form id="orderForm">
                    <div class="form-group">
                        <label for="orderProduct">Produto</label>
                        <select id="orderProduct" required>
                            <option value="">Selecione um produto</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="orderQuantity">Quantidade</label>
                        <input type="number" id="orderQuantity" required min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label for="orderUserId">ID do Usuário</label>
                        <input type="text" id="orderUserId" required placeholder="Ex: user-123">
                    </div>
                    <button type="submit" class="btn-success">Criar Pedido</button>
                </form>
            </div>
        </div>

        <div class="card">
            <h2>📝 Histórico de Pedidos</h2>
            <ul id="orderList" class="order-list">
                <li style="text-align: center; color: #999; padding: 20px;">Carregando pedidos...</li>
            </ul>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = 'http://localhost:3001';

        // Show toast notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.className = 'toast toast-' + type;
            toast.textContent = message;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        // Update health status
        async function updateHealthStatus() {
            const response = await fetch(API_BASE + '/health');
            const health = await response.json();

            const statusEl = document.getElementById('healthStatus');
            const dotEl = document.getElementById('connectionDot');

            if (health.status === 'healthy') {
                statusEl.textContent = '✅ Sistema Operacional';
                statusEl.className = 'health-status healthy';
                dotEl.className = 'connection-dot connected';
            } else {
                statusEl.textContent = '❌ Sistema Indisponível';
                statusEl.className = 'health-status unhealthy';
                dotEl.className = 'connection-dot disconnected';
            }
        }

        // Fetch products
        async function fetchProducts() {
            const response = await fetch(API_BASE + '/api/ecommerce/products');
            const products = await response.json();

            const productListEl = document.getElementById('productList');
            const orderProductEl = document.getElementById('orderProduct');

            productListEl.innerHTML = '';

            products.forEach(product => {
                const li = document.createElement('li');
                li.className = 'product-item';
                li.innerHTML = `
                    <h3>${product.name}</h3>
                    <p>Preço: R$ ${product.price.toFixed(2)}</p>
                    <p>ID: ${product.id}</p>
                    <div class="product-actions">
                        <button class="btn-primary" onclick="buyProduct('${product.id}', ${product.price})">
                            🛒 Comprar
                        </button>
                    </div>
                `;
                productListEl.appendChild(li);

                const option = document.createElement('option');
                option.value = product.id;
                option.textContent = `${product.name} - R$ ${product.price.toFixed(2)}`;
                orderProductEl.appendChild(option);
            });
        }

        // Fetch stock
        async function fetchStock() {
            const response = await fetch(API_BASE + '/api/ecommerce/stock');
            const stock = await response.json();

            const stockListEl = document.getElementById('stockList');

            stockListEl.innerHTML = '';

            stock.forEach(item => {
                const li = document.createElement('li');
                li.className = 'stock-item';
                li.innerHTML = `
                    <div class="stock-info">
                        <h3>${item.name}</h3>
                        <p>ID: ${item.productId}</p>
                    </div>
                    <div class="stock-quantity">${item.quantity}</div>
                `;
                stockListEl.appendChild(li);
            });
        }

        // Fetch orders
        async function fetchOrders() {
            const response = await fetch(API_BASE + '/api/ecommerce/orders');
            const orders = await response.json();

            const orderListEl = document.getElementById('orderList');

            orderListEl.innerHTML = '';

            orders.forEach(order => {
                const li = document.createElement('li');
                li.className = 'order-item';

                const statusClass = order.status === 'completed' ? 'status-completed' :
                                   order.status === 'processing' ? 'status-processing' : 'status-failed';

                li.innerHTML = `
                    <h3>Pedido #${order.id}</h3>
                    <p>Produto: ${order.productId}</p>
                    <p>Quantidade: ${order.quantity}</p>
                    <p>Usuário: ${order.userId}</p>
                    <p>Total: R$ ${order.totalAmount.toFixed(2)}</p>
                    <p>Data: ${new Date(order.createdAt).toLocaleString('pt-BR')}</p>
                    <span class="status-badge ${statusClass}">${order.status}</span>
                `;
                orderListEl.appendChild(li);
            });
        }

        // Create product
        async function createProduct(name, price, stock) {
            const response = await fetch(API_BASE + '/api/ecommerce/products', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: 'prod-' + Date.now(), name, price, stock })
            });

            if (response.ok) {
                showToast('Produto criado com sucesso!', 'success');
                fetchProducts();
                fetchStock();
                return true;
            } else {
                showToast('Erro ao criar produto', 'error');
                return false;
            }
        }

        // Buy product (create order)
        async function buyProduct(productId, price) {
            const quantity = document.getElementById('orderQuantity').value;
            const userId = document.getElementById('orderUserId').value;

            if (!userId) {
                showToast('Por favor, informe o ID do usuário', 'error');
                return;
            }

            const orderData = {
                productId,
                quantity: parseInt(quantity),
                userId
            };

            try {
                showToast('Criando pedido...', 'info');
                const response = await fetch(API_BASE + '/api/ecommerce/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const order = await response.json();
                    showToast(`Pedido criado! ID: ${order.id}`, 'success');

                    // Reserve stock
                    const stockResponse = await fetch(API_BASE + `/api/ecommerce/stock/${productId}/reserve`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ quantity: parseInt(quantity) })
                    });

                    if (stockResponse.ok) {
                        fetchStock();
                        fetchOrders();
                    }
                } else {
                    const error = await response.json();
                    showToast(`Erro ao criar pedido: ${error.message || 'Falha'}`, 'error');
                }
            } catch (error) {
                showToast('Erro de conexão', 'error');
            }
        }

        // Handle product form submission
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value);

            await createProduct(name, price, stock);

            e.target.reset();
        });

        // Handle order form submission
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
        });

        // Check connection on load
        updateHealthStatus();
        fetchProducts();
        fetchStock();
        fetchOrders();

        // Refresh data every 30 seconds
        setInterval(() => {
            fetchProducts();
            fetchStock();
            fetchOrders();
            updateHealthStatus();
        }, 30000);
    </script>
</body>
</html>
