<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c51bf"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3182ce"/></marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/></filter>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #2d3748; }
      .subtitle { font-size: 15px; fill: #718096; }
      .section { font-size: 21px; font-weight: 700; fill: #553c9a; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .label { font-size: 15px; font-weight: 600; fill: #1a202c; text-anchor: middle; }
      .small { font-size: 12.5px; fill: #4a5568; text-anchor: middle; }
      .tiny { font-size: 12px; fill: #4a5568; }
      .mono { font-size: 12px; font-family: Consolas, Menlo, monospace; fill: #2d3748; }
      .edge { font-size: 12px; fill: #4a5568; }
    </style>
  </defs>
  <rect width="1600" height="1330" fill="#ffffff"/>
  <text x="40" y="48" class="title" >🚀 Entrega, site e proteções de custo</text>
  <text x="40" y="74" class="subtitle" >GitHub Actions (OIDC) · AWS SAM · CloudFront + S3 · Cognito · limites diários · AWS Budgets · interruptor de custo</text>
  <rect x="20" y="95" width="1560" height="330" rx="14" class="" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="128" class="section" >1. Do commit à AWS</text>
  <rect x="45" y="150" width="230" height="114" rx="10" class="box" fill="#ebf8ff" stroke="#3182ce" />
  <text x="160.0" y="174" class="label" fill="#1a202c">💻 Commit local</text>
  <text x="61" y="196" class="tiny" >hook .githooks/pre-commit:</text>
  <text x="61" y="214" class="tiny" >ESLint nos arquivos em stage</text>
  <text x="61" y="232" class="tiny" >+ typecheck (tsc, JSDoc)</text>
  <text x="61" y="250" class="tiny" fill="#718096">pular: --no-verify</text>
  <line x1="275" y1="200" x2="323" y2="200" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="0" marker-end="url(#arrow)"/>
  <text x="282" y="192" class="edge" >push</text>
  <rect x="325" y="150" width="300" height="220" rx="10" class="box" fill="#faf5ff" stroke="#805ad5" />
  <text x="475" y="174" class="label" >⚙️ CI (.github/workflows/ci.yml)</text>
  <text x="341" y="196" class="tiny" >push e PR em master e prod</text>
  <rect x="340" y="210" width="270" height="66" rx="8" class="" fill="#ffffff" stroke="#b794f4" />
  <text x="352" y="230" class="tiny" font-weight="700" fill="#553c9a">job static</text>
  <text x="352" y="248" class="tiny" >lint · typecheck · npm test</text>
  <text x="352" y="266" class="tiny" >cfn-lint template.yaml</text>
  <rect x="340" y="286" width="270" height="66" rx="8" class="" fill="#ffffff" stroke="#b794f4" />
  <text x="352" y="306" class="tiny" font-weight="700" fill="#553c9a">job sast</text>
  <text x="352" y="324" class="tiny" >npm audit · Semgrep · Gitleaks</text>
  <text x="352" y="342" class="tiny" >Checkov (IaC)</text>
  <text x="340" y="392" class="tiny" fill="#718096">integração e e2e: locais (LocalStack)</text>
  <line x1="625" y1="260" x2="673" y2="260" stroke="#2f855a" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrow-green)"/>
  <text x="630" y="252" class="edge" fill="#2f855a">só push</text>
  <text x="630" y="280" class="edge" fill="#2f855a">em prod</text>
  <rect x="675" y="150" width="270" height="168" rx="10" class="box" fill="#f0fff4" stroke="#38a169" />
  <text x="810.0" y="174" class="label" fill="#1a202c">🔐 job deploy</text>
  <text x="691" y="196" class="tiny" >needs: static + sast</text>
  <text x="691" y="214" class="tiny" >environment: production</text>
  <text x="691" y="232" class="tiny" >concurrency: um deploy por vez</text>
  <text x="691" y="250" class="tiny" >credenciais por OIDC (sem chave):</text>
  <text x="691" y="268" class="tiny" fill="#553c9a">infra/github-oidc.yaml → role</text>
  <text x="691" y="286" class="tiny" fill="#553c9a">AWS_DEPLOY_ROLE_ARN</text>
  <text x="691" y="304" class="tiny" >→ npm run deploy</text>
  <line x1="945" y1="230" x2="993" y2="230" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="0" marker-end="url(#arrow)"/>
  <rect x="995" y="150" width="290" height="168" rx="10" class="box" fill="#fffaf0" stroke="#dd6b20" />
  <text x="1140.0" y="174" class="label" fill="#1a202c">📜 scripts/deploy.sh</text>
  <text x="1011" y="196" class="tiny" >1. npm ci · sam build (esbuild, arm64)</text>
  <text x="1011" y="214" class="tiny" >2. sam deploy (template.yaml)</text>
  <text x="1011" y="232" class="tiny" >3. cria/atualiza o admin no Cognito</text>
  <text x="1011" y="250" class="tiny" >    (só com ADMIN_PASSWORD)</text>
  <text x="1011" y="268" class="tiny" >4. sobe dashboard/ para o S3</text>
  <text x="1011" y="286" class="tiny" >    runtime-config.js ← ApiGatewayUrl</text>
  <text x="1011" y="304" class="tiny" >    Cache-Control: no-cache</text>
  <line x1="1285" y1="230" x2="1333" y2="230" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="0" marker-end="url(#arrow)"/>
  <rect x="1335" y="150" width="225" height="150" rx="10" class="box" fill="#ebf4ff" stroke="#4c51bf" />
  <text x="1447.5" y="174" class="label" fill="#1a202c">☁️ Stack CloudFormation</text>
  <text x="1351" y="196" class="tiny" >distributed-ecommerce-system</text>
  <text x="1351" y="214" class="tiny" >stage dev · us-east-1</text>
  <text x="1351" y="232" class="tiny" >8 Lambdas · 7 tabelas</text>
  <text x="1351" y="250" class="tiny" >state machine · HttpApi</text>
  <text x="1351" y="268" class="tiny" >CloudFront · Cognito</text>
  <text x="1351" y="286" class="tiny" >12 alarmes · 3 SLOs · 2 Budgets</text>
  <text x="1335" y="392" class="tiny" fill="#4c51bf">outputs: ApiGatewayUrl, DashboardUrl,</text>
  <text x="1335" y="410" class="tiny" fill="#4c51bf">SiteUrl, AdminUserPoolId…</text>
  <text x="675" y="392" class="tiny" fill="#718096">Local: npm run localstack:start · localstack:deploy · local-server (127.0.0.1:3001)</text>
  <rect x="20" y="445" width="1560" height="400" rx="14" class="" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="478" class="section" >2. Como o navegador chega ao site, ao dashboard e à API</text>
  <rect x="45" y="520" width="190" height="114" rx="10" class="box" fill="#ebf8ff" stroke="#3182ce" />
  <text x="140.0" y="544" class="label" fill="#1a202c">🧑 Navegador</text>
  <text x="61" y="566" class="tiny" >site e dashboard</text>
  <text x="61" y="584" class="tiny" >pelo CloudFront;</text>
  <text x="61" y="602" class="tiny" >API direto no</text>
  <text x="61" y="620" class="tiny" >execute-api (CORS)</text>
  <rect x="285" y="500" width="240" height="114" rx="10" class="box" fill="#ffffff" stroke="#a0aec0" />
  <text x="405.0" y="524" class="label" fill="#1a202c">Route 53 + ACM (opcional)</text>
  <text x="301" y="546" class="tiny" >DomainName + HostedZoneId</text>
  <text x="301" y="564" class="tiny" >registros A/AAAA (alias)</text>
  <text x="301" y="582" class="tiny" >certificado TLS por DNS</text>
  <text x="301" y="600" class="tiny" fill="#718096">sem eles: *.cloudfront.net</text>
  <line x1="235" y1="560" x2="283" y2="560" stroke="#3182ce" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrow-blue)"/>
  <text x="240" y="552" class="edge" fill="#2b6cb0">HTTPS</text>
  <rect x="575" y="500" width="420" height="280" rx="10" class="box" fill="#f0f5ff" stroke="#5a67d8" />
  <text x="785" y="524" class="label" >CloudFront (DashboardDistribution)</text>
  <text x="785" y="542" class="small" >HTTP/2 e 3 · IPv6 · PriceClass_100 · redirect-to-https</text>
  <rect x="590" y="560" width="390" height="52" rx="6" class="" fill="#ffffff" stroke="#a3bffa" />
  <text x="602" y="581" class="mono" font-weight="700">/ (padrão)</text>
  <text x="712" y="581" class="tiny" >→ HelloFunction (Function URL)</text>
  <text x="712" y="599" class="tiny" fill="#718096">sem cache · página inicial</text>
  <rect x="590" y="620" width="390" height="52" rx="6" class="" fill="#ffffff" stroke="#a3bffa" />
  <text x="602" y="641" class="mono" font-weight="700">/laboratory*</text>
  <text x="712" y="641" class="tiny" >→ CloudFront Function rewrite</text>
  <text x="712" y="659" class="tiny" fill="#718096">→ index.html do dashboard no S3</text>
  <rect x="590" y="680" width="390" height="52" rx="6" class="" fill="#ffffff" stroke="#a3bffa" />
  <text x="602" y="701" class="mono" font-weight="700">/dashboard/*</text>
  <text x="712" y="701" class="tiny" >→ S3 (js, css, img)</text>
  <text x="712" y="719" class="tiny" fill="#718096">CachingOptimized + no-cache</text>
  <text x="590" y="754" class="tiny" fill="#4c51bf">ResponseHeadersPolicy: CSP, HSTS, X-Frame-Options… (os mesmos</text>
  <text x="590" y="771" class="tiny" fill="#4c51bf">headers do local-server) · origens só via OAC (assinadas)</text>
  <line x1="525" y1="560" x2="573" y2="560" stroke="#3182ce" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrow-blue)"/>
  <rect x="1045" y="500" width="240" height="114" rx="10" class="box" fill="#fffaf0" stroke="#dd6b20" />
  <text x="1165.0" y="524" class="label" fill="#1a202c">λ HelloFunction</text>
  <text x="1061" y="546" class="tiny" >página de apresentação</text>
  <text x="1061" y="564" class="tiny" >Function URL AWS_IAM: só o</text>
  <text x="1061" y="582" class="tiny" >CloudFront (OAC) a invoca</text>
  <text x="1061" y="600" class="tiny" >concorrência reservada: 2*</text>
  <line x1="995" y1="586" x2="1043" y2="560" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="0" marker-end="url(#arrow)"/>
  <rect x="1045" y="640" width="240" height="114" rx="10" class="box" fill="#f0fff4" stroke="#38a169" />
  <text x="1165.0" y="664" class="label" fill="#1a202c">🪣 S3 DashboardBucket</text>
  <text x="1061" y="686" class="tiny" >privado · sem acesso público</text>
  <text x="1061" y="704" class="tiny" >bucket policy: só a</text>
  <text x="1061" y="722" class="tiny" >distribuição (OAC)</text>
  <text x="1061" y="740" class="tiny" >index.html + dashboard/*</text>
  <line x1="995" y1="646" x2="1043" y2="690" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="0" marker-end="url(#arrow)"/>
  <line x1="995" y1="706" x2="1043" y2="706" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="0" marker-end="url(#arrow)"/>
  <rect x="1335" y="500" width="225" height="132" rx="10" class="box" fill="#faf5ff" stroke="#805ad5" />
  <text x="1447.5" y="524" class="label" fill="#1a202c">API Gateway (HttpApi)</text>
  <text x="1351" y="546" class="tiny" >execute-api, não via CloudFront:</text>
  <text x="1351" y="564" class="tiny" >a API vê o IP real do cliente</text>
  <text x="1351" y="582" class="tiny" >(limite diário por IP)</text>
  <text x="1351" y="600" class="tiny" >CORS: CloudFront, localhost:3001,</text>
  <text x="1351" y="618" class="tiny" >AllowedOrigin, domínio próprio</text>
  <rect x="1335" y="660" width="225" height="96" rx="10" class="box" fill="#fff5f5" stroke="#c53030" />
  <text x="1447.5" y="684" class="label" fill="#1a202c">Cognito AdminUserPool</text>
  <text x="1351" y="706" class="tiny" >login USER_PASSWORD_AUTH</text>
  <text x="1351" y="724" class="tiny" >access token 1 h · refresh 12 h</text>
  <text x="1351" y="742" class="tiny" >no sessionStorage da aba</text>
  <path d="M 140 640 L 140 820 L 1300 820 L 1300 560 L 1333 560" stroke="#805ad5" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="320" y="814" class="edge" fill="#553c9a">fetch da API (Authorization: Bearer nas rotas 🔑)</text>
  <path d="M 190 640 L 190 800 L 1310 800 L 1310 700 L 1333 700" stroke="#c53030" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="320" y="794" class="edge" fill="#c53030">login de admin direto no Cognito</text>
  <g transform="translate(0,40)">
  <rect x="20" y="825" width="1560" height="445" rx="14" class="" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="858" class="section" >3. Proteções de custo (camadas, da mais rápida à mais lenta)</text>
  <rect x="45" y="885" width="245" height="156" rx="10" class="box" fill="#faf5ff" stroke="#805ad5" />
  <text x="167.5" y="909" class="label" fill="#1a202c">1 · Throttling por rota</text>
  <text x="61" y="931" class="tiny" >DefaultRouteSettings: 10 req/s</text>
  <text x="61" y="950" class="tiny" >escritas de admin, caos: 2 req/s</text>
  <text x="61" y="969" class="tiny" >/health, /auth/config: 5 req/s</text>
  <text x="61" y="988" class="tiny" >GET /products: 30 req/s</text>
  <text x="61" y="1007" class="tiny" >leituras caras: limite menor</text>
  <text x="61" y="1026" class="tiny" fill="#c53030">acima: 429 na hora</text>
  <rect x="305" y="885" width="245" height="156" rx="10" class="box" fill="#fffaf0" stroke="#c05621" />
  <text x="427.5" y="909" class="label" fill="#1a202c">2 · Limites diários</text>
  <text x="321" y="931" class="tiny" >compras: 150/dia e 20/dia por IP</text>
  <text x="321" y="950" class="tiny" >caos: 20 ativações/dia</text>
  <text x="321" y="969" class="tiny" >zerar base: 10/dia</text>
  <text x="321" y="988" class="tiny" >leitura manual do custo: 5/dia</text>
  <text x="321" y="1007" class="tiny" >contadores na tabela Sagas</text>
  <text x="321" y="1026" class="tiny" fill="#c53030">zeram às 12:00 (Brasília) · 429</text>
  <rect x="565" y="885" width="245" height="156" rx="10" class="box" fill="#f0fff4" stroke="#2f855a" />
  <text x="687.5" y="909" class="label" fill="#1a202c">3 · Leituras baratas</text>
  <text x="581" y="931" class="tiny" >Cost Explorer (cobrado por chamada):</text>
  <text x="581" y="950" class="tiny" >regra a cada 6 h → CostSnapshots</text>
  <text x="581" y="969" class="tiny" >GetMetricData em cache</text>
  <text x="581" y="988" class="tiny" >leituras do CloudWatch só com</text>
  <text x="581" y="1007" class="tiny" >login (🔑) · concorrência</text>
  <text x="581" y="1026" class="tiny" >reservada opcional (Gateway)</text>
  <rect x="830" y="885" width="255" height="92" rx="10" class="box" fill="#fefcbf" stroke="#d69e2e" />
  <text x="957" y="909" class="label" >MonthlyBudget (AWS Budgets)</text>
  <text x="846" y="931" class="tiny" >MonthlyBudgetUSD (padrão US$ 5)</text>
  <text x="846" y="949" class="tiny" >real &gt; 80% ou previsto &gt; 100%</text>
  <text x="846" y="967" class="tiny" fill="#975a16">→ e-mail pelo AlarmTopic</text>
  <rect x="830" y="995" width="255" height="74" rx="10" class="box" fill="#fefcbf" stroke="#d69e2e" />
  <text x="957" y="1019" class="label" >CostKillSwitchBudget</text>
  <text x="846" y="1041" class="tiny" >gasto real &gt; 100% do teto</text>
  <text x="846" y="1059" class="tiny" fill="#718096">(o Budget vê com horas de atraso)</text>
  <rect x="830" y="1087" width="255" height="92" rx="10" class="box" fill="#fff5f5" stroke="#c53030" />
  <text x="957" y="1111" class="label" >ApiFloodAlarm (api-flood)</text>
  <text x="846" y="1133" class="tiny" >≥ FloodRequestsPer5Min (15000)</text>
  <text x="846" y="1151" class="tiny" >em 5 min, 2 janelas seguidas</text>
  <text x="846" y="1169" class="tiny" fill="#718096">(~50 req/s) → reage em ~10 min</text>
  <rect x="1135" y="1010" width="140" height="60" rx="10" class="box" fill="#fff5f5" stroke="#c53030" />
  <text x="1205" y="1036" class="label" >SNS</text>
  <text x="1205" y="1055" class="small" >cost-kill-switch</text>
  <path d="M 1085 1032 L 1133 1032" stroke="#c53030" stroke-width="2" stroke-dasharray="0" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 1085 1133 L 1110 1133 L 1110 1055 L 1133 1055" stroke="#c53030" stroke-width="2" stroke-dasharray="0" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="1325" y="950" width="235" height="150" rx="10" class="box" fill="#fff5f5" stroke="#c53030" />
  <text x="1442.5" y="974" class="label" fill="#1a202c">λ CostKillSwitchFunction</text>
  <text x="1341" y="996" class="tiny" >guarda o throttling atual no</text>
  <text x="1341" y="1014" class="tiny" >SSM (throttle-backup) e zera</text>
  <text x="1341" y="1032" class="tiny" >o throttling do stage:</text>
  <text x="1341" y="1050" class="tiny" fill="#c53030">a API inteira responde 429</text>
  <text x="1341" y="1068" class="tiny" >religar: {"action":"restore"}</text>
  <text x="1341" y="1086" class="tiny" fill="#718096">(costKillSwitch.js)</text>
  <line x1="1275" y1="1040" x2="1323" y2="1040" stroke="#c53030" stroke-width="2" stroke-dasharray="0" marker-end="url(#arrow-red)"/>
  <text x="830" y="1210" class="tiny" fill="#4a5568">O interruptor não apaga nada: só fecha a porta da API. Site e dashboard continuam no ar</text>
  <text x="830" y="1228" class="tiny" fill="#4a5568">(estáticos no CloudFront), e os alarmes e o e-mail avisam o que aconteceu.</text>
  <text x="45" y="1210" class="tiny" fill="#4a5568">Caos e Zerar base ficam desligados em prod; a página inicial (HelloFunction) tem</text>
  <text x="45" y="1228" class="tiny" fill="#4a5568">concorrência própria, para não tirar capacidade da compra.</text>
  <text x="45" y="1252" class="tiny" fill="#718096">* concorrência reservada só quando GatewayConcurrencyLimit &gt; 0 (contas novas não aceitam reserva).</text>
  </g>
</svg>
