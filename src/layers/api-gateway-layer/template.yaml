AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  API Gateway Centralizado - Camada de entrada única para todos os serviços

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name

Resources:
  # API Gateway Centralizado (HttpApi)
  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins: "'*'"
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
      Auth:
        DefaultAuthorizer: NONE
        Authorizers:
          JWT:
            Type: JWT
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: https://cognito-idp.<REGION>.amazonaws.com/<POOL_ID>
              audience:
                - <CLIENT_ID>
      Description: "API Gateway centralizado para todos os endpoints"

  # Lambda para roteamento e handlers
  GatewayFunction:
    Type: AWS::ServerlessFunction
    Properties:
      CodeUri: src/
      Handler: routes/apiRoutes.handler
      Runtime: nodejs18.x
      Architectures: [arm64]
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref ApiGateway
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StockReservationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SagasTable

Outputs:
  ApiGatewayUrl:
    Description: "API Gateway URL (público)"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  ApiGatewayId:
    Description: "API Gateway ID"
    Value: !Ref ApiGateway

  # DynamoDB Tables (referenciadas pela API Gateway)
  ProductsTable:
    Description: "Products DynamoDB Table"
    Value: !Ref ProductsTable

  OrdersTable:
    Description: "Orders DynamoDB Table"
    Value: !Ref OrdersTable

  PaymentsTable:
    Description: "Payments DynamoDB Table"
    Value: !Ref PaymentsTable

  StockReservationsTable:
    Description: "Stock Reservations DynamoDB Table"
    Value: !Ref StockReservationsTable

  SagasTable:
    Description: "Sagas DynamoDB Table"
    Value: !Ref SagasTable